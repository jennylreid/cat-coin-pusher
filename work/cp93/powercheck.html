<!doctype html>
<!-- Real-browser boot + power check (CP-73 follow-up, UAT 93; from CP-72's powercheck): Formal inspection on the Tuxedo board: loads ?dir=<folder>/index.html (the full runtime folder, as on the phone) in a frame,
     waits for the title screen with art, starts a Level 1 round through the real Play button path, waits for play, then
     writes the result into #result as JSON. Run headless: chrome --headless=new --dump-dom --virtual-time-budget=... -->
<html><head><meta charset="utf-8"><title>boot check</title></head><body>
<iframe id="g" style="width:400px;height:889px;border:0"></iframe><pre id="result">PENDING</pre>
<script>
const dir=new URLSearchParams(location.search).get('dir')||'boot82',g=document.getElementById('g'),out=document.getElementById('result');
const res={dir,steps:[],errors:[]};const done=()=>{out.textContent=JSON.stringify(res);};
g.src=dir+'/index.html';
g.onload=()=>{const w=g.contentWindow;w.addEventListener('error',e=>res.errors.push(String(e.message)));
 const t0=Date.now();const iv=setInterval(()=>{try{
  const txt=w.document.body.innerText||'';if(/Could not start/.test(txt)){res.steps.push('could not start: '+txt.slice(0,160));clearInterval(iv);return done();}
  const ok=w.eval("typeof ART!=='undefined'&&!!ART.head&&typeof bodies!=='undefined'&&bodies.length>0");
  if(ok&&!res.title){res.title=true;res.build=w.eval('BUILD');res.screen=w.eval('PGU.screen');res.steps.push('title with art at '+(Date.now()-t0)+' ms');
   w.eval("if(!PG)pgInit();PGU.title.t=9;pgTitleDone();PG.lv.passed=0;PG.lv.sel=1;wildReset();PGU.screen='board';pgStartRound();");}
  if(res.title&&!res.play&&w.eval("WILD.phase==='play'")){res.play=true;res.steps.push('round in play at '+(Date.now()-t0)+' ms');
   res.state=w.eval("JSON.stringify({level:pglSel(),prizes:bodies.filter(b=>!b.dead&&b.kind==='item').map(b=>b.id),cp62:Object.keys(CP62_ART).length,runway:!!CP58_RUNWAY&&!!CP58_RUNWAY_EYES})");
   res.state0=res.state;w.eval("for(const c of PG_CATS)PG.open[c]=true;PG.lv.passed=Math.max(PG.lv.passed,PG_SWITCH_LEVEL);wildExit();pgPlay('tuxedo');if(WILD.phase==='end')wildReset();wildStartCountdown();");
   res.steps.push('Tuxedo board: '+w.eval('PGU.boardCat'));return;}
  if(res.play&&!res.tapped&&w.eval("PGU.boardCat==='tuxedo'&&WILD.phase==='play'")){res.tapped=true;w.eval("WILD.left=60;PG.powers=PG.powers||{};PG.powers.tuxedo=1;");
   const pb=w.eval('JSON.stringify(pgpButton())'),B=JSON.parse(pb);w.eval('powerTap({x:'+(B.x+B.w/2)+',y:'+(B.y+B.h/2)+'})');res.started=w.eval('!!CP63X&&cp73BigOn()&&CP73W.word==="FORMAL INSPECTION!"');res.steps.push('power tapped, started='+res.started);
   res.frames0=w.eval('typeof frameCount!=="undefined"?frameCount:0');
   setTimeout(()=>{try{res.power=res.started&&w.eval('!CP63X&&!PGPX');res.stats=w.eval('JSON.stringify({runs:CP63.stats.runs,picked:CP63.stats.picked})');res.period=w.eval('PUSH_PERIOD');res.steps.push('power over: '+res.power);}catch(e){res.errors.push(String(e));}done();},10000);
   clearInterval(iv);return;}
  if(Date.now()-t0>80000){res.steps.push('timeout');clearInterval(iv);done();}
 }catch(e){res.errors.push(String(e));}},250);};
</script></body></html>
