<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#153c36">
<title>Cat Jam · Sushi Bar</title>
<style>
:root{color-scheme:light;--ink:#183731;--muted:#53675b;--paper:#fff8e9;--tan:#ead8b6;--green:#19483e;--wood:#d39c63}
*{box-sizing:border-box}
body{margin:0;background:var(--green);color:var(--ink);font:500 14px/1.35 system-ui,sans-serif}
button,select{font:inherit;color:inherit}
button,select{touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid #bc531e;outline-offset:2px}
main{max-width:450px;margin:auto;min-height:100svh;padding:14px 16px 16px;background:var(--paper);display:flex;flex-direction:column;gap:12px}
header{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow,.label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:850}
.eyebrow{color:#86512f}
h1{font:700 50px/.87 Georgia,serif;letter-spacing:-.075em;margin:5px 0 0}
.controls{display:flex;flex-direction:column;gap:5px}
select,.plain{border:1px solid #b7ba9e;border-radius:8px;background:#fffdf5;min-height:38px;padding:0 8px;font-weight:750}
.daily{border:0;background:transparent;text-decoration:underline;text-underline-offset:3px;font-size:12px;min-height:25px}
.daily[aria-pressed=true]{color:#835023;font-weight:800}
#intro{margin:0;color:var(--muted);font-size:13px}
.bar{border:1px solid #402f25;border-radius:15px;overflow:hidden;background:#273f36;box-shadow:0 3px #decab0}
.bar-head,.room-head{display:flex;justify-content:space-between;align-items:center}
.bar-head{padding:5px 10px;color:#fff6e2}
.bar-head button{border:0;border-radius:6px;background:transparent;color:#fff6e2;padding:5px 0 5px 5px;text-decoration:underline;text-underline-offset:3px;font-size:11px;min-height:30px}
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:5px 7px;background:repeating-linear-gradient(90deg,#454640 0 9px,#3d3d36 9px 12px);border-block:2px solid #192e28}
.belt-cell{display:grid;place-items:center;position:relative;min-width:0;height:42px}
.belt-cell:first-child{outline:1px solid #ffdb91;border-radius:7px;background:#242d27}
.belt-cell:first-child::after{content:"NEXT";position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;letter-spacing:.07em;color:#fff0c7}
.plate{position:relative;display:grid;place-items:center;width:min(100%,43px);aspect-ratio:1.3;border-radius:50%;background:var(--tone);color:var(--mark);border:2px solid #3f352a;box-shadow:inset 0 0 0 2px #ffffff62,0 2px #25261c80}
.belt-cell:first-child .plate{margin-top:-7px}
.plate img{width:72%;height:79%;object-fit:contain}
.plate b{position:absolute;right:-1px;bottom:-2px;font-size:12px;line-height:1;background:#fff8e9;border:1px solid currentColor;border-radius:50%;width:15px;height:15px;text-align:center}
.counter{background:repeating-linear-gradient(0deg,#d6a06a 0 17px,#bb85512b 17px 18px,#d7a46f 18px 23px);padding:6px 7px 7px;border-top:3px solid #edc890}
.counter-head{display:flex;justify-content:space-between;margin:0 2px 4px;color:#452c1d}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.stool{position:relative;height:52px;background:#744c3953;border:1px dashed #805437;border-radius:10px;display:grid;justify-items:center;align-content:center;overflow:hidden}
.stool.empty::before{content:"";display:block;width:24px;height:15px;border-radius:50%;background:#9e604a;box-shadow:0 3px #744636,inset 0 1px #c28c6b}
.stool.filled{background:#fff3d6;border:1px solid #98643e}
.stool img{width:41px;height:27px;object-fit:contain}
.progress{display:flex;gap:3px}
.progress i{display:block;width:6px;height:6px;border:1px solid #7d6a58;border-radius:50%}
.progress i.fed{background:var(--mark);border-color:var(--mark)}
.room-head{margin:0 1px 5px}
.room-head span:last-child{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px;background:#ddcaab;border:1px solid #c4ae87;border-radius:12px;padding:5px}
.tile{position:relative;display:grid;place-items:center;border:1px solid #d4bd96;border-radius:7px;min-width:0;height:clamp(48px,8.4svh,75px);background:#f4e6ca}
.tile:nth-child(even){background:#efe0c1}
.cat{width:100%;height:100%;padding:0;border:0;border-radius:6px;background:#fff8e5;position:relative;display:grid;place-items:center;align-content:center;box-shadow:inset 0 -2px #dfc89a}
.cat.clear{background:#fcfff0;box-shadow:inset 0 0 0 1px #829675,inset 0 -3px #b9c7a1}
.face{pointer-events:none;width:79%;height:clamp(25px,4.9svh,47px);object-fit:contain}
.bib{display:grid;place-items:center;line-height:1;width:23px;height:15px;font-size:12px;font-weight:900;background:var(--tone);color:var(--mark);border:1px solid currentColor;border-radius:4px 4px 10px 10px;z-index:1}
.cat .bib{margin-top:-3px}
.arrow{position:absolute;display:grid;place-items:center;width:19px;height:19px;border-radius:6px;right:1px;bottom:1px;color:#fff;background:#576354;font-size:16px;font-weight:900;line-height:1}
.clear .arrow{background:#204f3f}
.stool .bib{position:absolute;right:2px;top:2px;width:16px;height:14px;font-size:10px}
footer{display:flex;align-items:center;gap:8px}
#status{flex:1;margin:0;font-size:12px;min-height:34px;display:flex;align-items:center}
#retry{flex:none}
#outcome{padding:10px 12px;border-radius:12px;border:1px solid #8caa83;background:#e6edd7}
#outcome[data-result=loss]{background:#f9dfc9;border-color:#c28c72}
#outcome strong{font:700 23px/1 Georgia,serif}
#outcome p{margin:4px 0 0;font-size:12px}
dialog{width:min(calc(100% - 24px),420px);max-height:80svh;border:1px solid #a48f6d;border-radius:16px;background:var(--paper);color:var(--ink);padding:14px}
dialog::backdrop{background:#142922b8}
dialog h2{margin:0;font:700 26px Georgia,serif}
#orders{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;list-style:none;padding:0}
#orders li{display:grid;justify-items:center;gap:2px;font-size:10px;color:var(--muted)}
.trot{position:fixed;z-index:2;pointer-events:none;display:grid;justify-items:center}
.trot img{width:100%;height:39px;object-fit:contain}
.bump{animation:bump .24s ease}
@keyframes bump{30%{transform:translate(var(--dx),var(--dy))}65%{transform:translate(calc(var(--dx) * -.24),calc(var(--dy) * -.24))}}
@media(max-height:720px){
 main{padding:9px 11px 9px;gap:6px}
 h1{font-size:42px}
 #intro{font-size:12px}
 .bar-head{padding-block:2px}
 .belt-cell{height:39px}
 .stool{height:45px}
 .stool img{height:24px}
 .tile{height:clamp(46px,7.2svh,53px)}
 #outcome{padding:6px 9px}
 #outcome strong{font-size:20px}
}
@media(prefers-reduced-motion:reduce){.bump{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <div><div class="eyebrow">Daily puzzles · Sushi bar</div><h1>Cat Jam</h1></div>
    <div class="controls">
      <select id="board" aria-label="Choose a board"></select>
      <button type="button" class="daily" id="daily" aria-pressed="false">Play today's board</button>
    </div>
  </header>
  <p id="intro">Tap a cat with a clear path. Match its bib to the next plate. Three plates and it goes home.</p>
  <section class="bar" aria-label="Sushi bar">
    <div class="bar-head"><span class="label">Conveyor <span aria-hidden="true">←</span></span><button id="menu" type="button">See plate order</button></div>
    <div id="belt" class="track"></div>
    <div class="counter">
      <div class="counter-head label"><span>Counter</span><span id="capacity"></span></div>
      <div id="seats" class="seats"></div>
    </div>
  </section>
  <section aria-label="Waiting room">
    <div class="room-head"><span class="label">Waiting room</span><span id="waiting"></span></div>
    <div id="grid" class="grid"></div>
  </section>
  <section id="outcome" role="status" hidden><strong></strong><p></p></section>
  <footer>
    <p id="status" aria-live="polite"></p>
    <button class="plain" id="retry" type="button">Restart</button>
  </footer>
</main>
<dialog id="menu-dialog" aria-labelledby="menu-title">
  <div class="room-head"><h2 id="menu-title">Plate order</h2><form method="dialog"><button class="plain">Close</button></form></div>
  <p>Plates are served in this order, starting from the next plate.</p>
  <ol id="orders"></ol>
</dialog>

const BOARDS = [
  {"w": 4, "h": 3, "cats": [[1, 0, 1], [0, 2, 1], [9, 0, 0], [11, 1, 2], [2, 0, 0], [7, 0, 2], [4, 3, 0]], "belt": "222000111222000000111"},
  {"w": 4, "h": 3, "cats": [[2, 0, 2], [1, 3, 0], [0, 3, 0], [11, 0, 2], [3, 0, 0], [9, 3, 1], [6, 0, 1], [7, 1, 1], [4, 2, 2]], "belt": "111000111000222111222222000"},
  {"w": 5, "h": 3, "cats": [[4, 2, 1], [5, 3, 1], [3, 1, 2], [2, 0, 0], [1, 2, 3], [9, 3, 0], [11, 1, 1], [12, 2, 3], [13, 1, 0], [10, 2, 2]], "belt": "303030003301312122222111111000"},
  {"w": 5, "h": 4, "cats": [[10, 1, 0], [8, 2, 3], [14, 1, 2], [3, 0, 0], [18, 2, 2], [9, 2, 3], [13, 1, 1], [15, 3, 0], [2, 3, 1], [16, 3, 3], [12, 1, 1], [17, 1, 2], [0, 3, 0]], "belt": "333003033220201101111000112212333002022"},
  {"w": 5, "h": 4, "cats": [[5, 2, 0], [19, 3, 1], [3, 0, 4], [8, 2, 0], [15, 3, 0], [1, 3, 3], [9, 0, 1], [12, 1, 3], [13, 1, 2], [11, 3, 4], [16, 3, 2], [6, 1, 1], [2, 3, 2], [17, 3, 3], [0, 0, 4]], "belt": "334334400313101444111222010041142432233220020"}
];
const NAMES = ['First Seating', 'Lunch Rush', 'Mixed Plates', 'Dinner Crowd', 'Full House'];
const PALETTE = [
  ['Rose','●','#f6a5a3','#822c37'], ['Gold','◆','#ffd17c','#6a430c'],
  ['Mint','▲','#9ed7b5','#205945'], ['Lilac','✦','#d1b9ee','#53367d'],
  ['Sky','■','#a9d6f2','#284e78']
];
const FOOD = ['shrimp','cheese','tuna','sardine','biscuit'];
const CATS = ['Tuxedo','Orange','Ragdoll','Siamese','Tortoiseshell'];
const DIR = [[0,-1,'↑','up'],[1,0,'→','right'],[0,1,'↓','down'],[-1,0,'←','left']];
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const SEAT_COUNT = 5;
const PORTIONS = 3;
let game, usingDaily = false, busy = false, run = 0;
const today = new Date();
const day = Math.floor(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()) / 86400000);
const dailyBoard = day % BOARDS.length;
const tone = c => 'style="--tone:' + PALETTE[c][2] + ';--mark:' + PALETTE[c][3] + '"';
const bib = c => '<span class="bib" aria-hidden="true" ' + tone(c) + '>' + PALETTE[c][1] + '</span>';
const face = (cat, happy = false) => '<img class="face" alt="" draggable="false" src="' + ART[(happy ? 'happy' : 'cat') + cat.face] + '">';
const plate = c => '<span class="plate" role="img" aria-label="' + PALETTE[c][0] + ' plate, ' + FOOD[c] + '" ' + tone(c) +
  '><img alt="" src="' + ART[FOOD[c]] + '"><b aria-hidden="true">' + PALETTE[c][1] + '</b></span>';

function pathFor(cat) {
  const [dx, dy] = DIR[cat.dir];
  const path = [];
  for (let x = cat.cell % game.w + dx, y = Math.floor(cat.cell / game.w) + dy;
       x >= 0 && y >= 0 && x < game.w && y < game.h; x += dx, y += dy) {
    path.push(y * game.w + x);
  }
  return path;
}

function drawRoom(focusCell = -1) {
  const grid = $('grid');
  grid.style.setProperty('--cols', game.w);
  grid.innerHTML = Array.from({length:game.w * game.h}, (_, cell) => {
    const cat = game.room.get(cell);
    if (!cat) return '<div class="tile" aria-hidden="true"></div>';
    const open = !pathFor(cat).some(step => game.room.has(step));
    const [, , arrow, direction] = DIR[cat.dir];
    const label = CATS[cat.face] + ', ' + PALETTE[cat.color][0] + ' bib, facing ' + direction + (open ? ', clear path' : ', blocked');
    return '<div class="tile"><button type="button" class="cat' + (open ? ' clear' : '') + '" data-cell="' + cell +
      '" aria-label="' + label + '">' + face(cat) + bib(cat.color) + '<span class="arrow" aria-hidden="true">' + arrow + '</span></button></div>';
  }).join('');
  $('waiting').textContent = game.room.size + ' waiting';
  if (focusCell >= 0) grid.querySelector('button[data-cell="' + focusCell + '"], button.clear, button.cat')?.focus({preventScroll:true});
}

function drawCounter(happySeat = -1) {
  $('belt').innerHTML = Array.from({length:6}, (_, i) => '<div class="belt-cell">' +
    (game.belt[game.next + i] === undefined ? '' : plate(game.belt[game.next + i])) + '</div>').join('');
  $('capacity').textContent = game.seats.filter(Boolean).length + ' / ' + SEAT_COUNT + ' seated';
  $('seats').innerHTML = game.seats.map((cat, i) => cat ?
    '<div class="stool filled" role="img" aria-label="' + CATS[cat.face] + ', ' + PALETTE[cat.color][0] + ', ' + cat.fed + ' of 3 plates">' +
      face(cat, i === happySeat) + bib(cat.color) + '<span class="progress" aria-hidden="true" ' + tone(cat.color) + '>' +
      Array.from({length:PORTIONS}, (_, portion) => '<i class="' + (portion < cat.fed ? 'fed' : '') + '"></i>').join('') + '</span></div>'
    : '<div class="stool empty" role="img" aria-label="Free seat"></div>').join('');
  if ($('menu-dialog').open) drawOrders();
}

function drawOrders() {
  $('orders').innerHTML = game.belt.slice(game.next).map((c, i) =>
    '<li>' + plate(c) + '<span>' + (i ? i + 1 : 'Next') + '</span></li>').join('');
}

function start(index, daily = false) {
  run++;
  document.querySelectorAll('.trot').forEach(node => node.remove());
  document.getAnimations().forEach(animation => animation.cancel());
  usingDaily = daily;
  $('daily').setAttribute('aria-pressed', daily);
  $('daily').textContent = daily ? 'Today’s board' : 'Play today’s board';
  const board = BOARDS[index];
  const room = new Map(board.cats.map(([cell, dir, color], i) =>
    [cell, {cell, dir, color, face: (i + index + (daily ? day % 5 : 0)) % 5, fed:0}]));
  game = {index, w:board.w, h:board.h, room, belt:[...board.belt].map(Number),
    seats:Array(SEAT_COUNT).fill(null), next:0, entered:0, done:null};
  busy = false;
  $('board').value = index;
  $('outcome').hidden = true;
  $('retry').textContent = 'Restart';
  $('status').textContent = 'Read the arrows and keep a seat free for the next match.';
  drawRoom();
  drawCounter();
}

async function animate(element, frames, ms) {
  if (reduce.matches) return;
  try { await element.animate(frames, {duration:ms,easing:'ease-in-out'}).finished; }
  catch (error) { if (error.name !== 'AbortError') throw error; }
}

async function trot(button, cat, slot) {
  if (reduce.matches) return;
  const from = button.getBoundingClientRect();
  const to = $('seats').children[slot].getBoundingClientRect();
  const [dx, dy] = DIR[cat.dir];
  const ghost = document.createElement('div');
  ghost.className = 'trot';
  Object.assign(ghost.style, {left:from.left+'px',top:from.top+'px',width:from.width+'px'});
  ghost.innerHTML = face(cat) + bib(cat.color);
  document.body.append(ghost);
  const lane = $('grid').getBoundingClientRect();
  const exitX = dx > 0 ? lane.right - from.right + 13 : dx < 0 ? lane.left - from.left - 13 : 0;
  const exitY = dy > 0 ? lane.bottom - from.bottom + 12 : dy < 0 ? lane.top - from.top - 12 : 0;
  const tx = to.left + (to.width - from.width)/2 - from.left;
  const ty = to.top - from.top;
  await animate(ghost, [
    {transform:'translate(0,0)'}, {transform:'translate('+exitX/2+'px,'+(exitY/2-5)+'px)',offset:.24},
    {transform:'translate('+exitX+'px,'+exitY+'px)',offset:.49},
    {transform:'translate('+((tx+exitX)/2)+'px,'+((ty+exitY)/2-8)+'px) scale(.9)',offset:.74},
    {transform:'translate('+tx+'px,'+ty+'px) scale(.76)'}
  ], 380);
  ghost.remove();
}

async function serve(token) {
  while (game.next < game.belt.length) {
    const c = game.belt[game.next];
    let slot = -1;
    game.seats.forEach((cat, i) => {
      if (cat?.color === c && (slot < 0 || cat.order < game.seats[slot].order)) slot = i;
    });
    if (slot < 0) break;
    const cat = game.seats[slot];
    await animate($('belt'), [{transform:'translateX(0)'},{transform:'translateX(-18px)'}], 125);
    if (token !== run) return;
    game.next++;
    cat.fed++;
    const full = cat.fed === PORTIONS;
    drawCounter(full ? slot : -1);
    if (full) {
      await animate($('seats').children[slot].querySelector('img'), [
        {transform:'translateY(0)'},{transform:'translateY(-6px) scale(1.13)'},
        {transform:'translateY(1px) scale(.94)'},{transform:'translateY(0)'}
      ], 300);
      if (token !== run) return;
      game.seats[slot] = null;
      drawCounter();
    }
  }
}

function finishIfNeeded() {
  const count = game.seats.filter(Boolean).length;
  const win = !game.room.size && !count;
  if (!win && count < SEAT_COUNT) {
    const next = PALETTE[game.belt[game.next]][0];
    $('status').textContent = 'Waiting for a ' + next.toLowerCase() + ' bib to take the next plate.';
    return;
  }
  game.done = win ? 'win' : 'loss';
  const box = $('outcome');
  box.dataset.result = game.done;
  box.querySelector('strong').textContent = win ? 'Everyone fed!' : 'Counter jam!';
  box.querySelector('p').textContent = win ? 'The waiting room and all five seats are clear.' :
    'Five seats full. The next plate needs a ' + PALETTE[game.belt[game.next]][0].toLowerCase() + ' bib.';
  box.hidden = false;
  $('status').textContent = NAMES[game.index] + ' · ' + (win ? game.next + ' plates served' : game.room.size + ' cats still waiting');
  $('retry').textContent = 'Play again';
}

async function release(button, keyboard) {
  if (busy || game.done) return;
  const cat = game.room.get(Number(button.dataset.cell));
  const path = pathFor(cat);
  if (path.some(step => game.room.has(step))) {
    const [dx, dy, , direction] = DIR[cat.dir];
    $('status').textContent = 'Blocked to the ' + direction.replace(/^up$/,'top').replace(/^down$/,'bottom') + '. Move the cat in its way first.';
    button.classList.remove('bump');
    void button.offsetWidth;
    button.style.setProperty('--dx',dx*4+'px');
    button.style.setProperty('--dy',dy*4+'px');
    button.classList.add('bump');
    return;
  }
  const slot = game.seats.indexOf(null);
  busy = true;
  const token = run;
  const motion = trot(button, cat, slot);
  game.room.delete(cat.cell);
  drawRoom(keyboard ? cat.cell : -1);
  $('status').textContent = CATS[cat.face] + ' is heading to the counter.';
  await motion;
  if (token !== run) return;
  cat.order = game.entered++;
  game.seats[slot] = cat;
  drawCounter();
  await serve(token);
  if (token !== run) return;
  finishIfNeeded();
  busy = false;
}

$('grid').addEventListener('click', event => {
  const button = event.target.closest('button.cat');
  if (button) release(button, event.detail === 0);
});
$('board').innerHTML = NAMES.map((name, i) => '<option value="' + i + '">' + (i+1) + ' · ' + name + '</option>').join('');
$('board').addEventListener('change', event => start(Number(event.target.value)));
$('daily').addEventListener('click', () => { if (!usingDaily) start(dailyBoard, true); });
$('retry').addEventListener('click', () => start(game.index, usingDaily));
$('menu').addEventListener('click', () => { drawOrders(); $('menu-dialog').showModal(); });
start(0);
</script>
</body>
