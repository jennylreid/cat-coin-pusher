<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cat Café</title>
<style>
  :root { --bg: #2b1e17; --ink: #fff6e6; --panel: #4a3326; --accent: #ffcf4a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none;
    touch-action: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  canvas { display: block; position: fixed; inset: 0; }
  #hud { position: fixed; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 8px;
    padding: 0 10px; box-sizing: border-box; pointer-events: none; }
  #hud .t { font-weight: 800; font-size: 16px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { pointer-events: auto; border: 0; border-radius: 12px; background: var(--panel); color: var(--ink); font: 700 15px system-ui, sans-serif;
    padding: 9px 12px; min-width: 40px; min-height: 40px; }
  .btn:disabled { opacity: 0.4; }
  .btn.big { background: var(--accent); color: #3b1d0e; font-size: 18px; padding: 14px 22px; border-radius: 16px; }
  #ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(28, 18, 12, 0.85); gap: 14px; padding: 16px; box-sizing: border-box; text-align: center; }
  #ov.hide { display: none; }
  #ov h1 { margin: 0; font-size: 34px; }
  #ov p { margin: 0; max-width: 340px; line-height: 1.4; font-size: 15px; opacity: 0.92; }
  #ov img { width: 150px; }
  .levels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(340px, 100%); }
  .levels .btn { padding: 14px 8px; font-size: 15px; }
  .levels .btn small { display: block; font-weight: 600; opacity: 0.75; font-size: 12px; margin-top: 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button class="btn" id="bMenu" aria-label="Puzzles">☰</button>
  <div class="t" id="hTitle">Cat Café</div>
  <button class="btn" id="bUndo">Undo</button>
  <button class="btn" id="bMute" aria-label="Sound">🔊</button>
</div>
<div id="ov"></div>
<script>/*ASSETS*/</script>
<script>/*COMMON*/</script>
<script>
// ---------------- Cat Café chain ----------------
// Rules (same as tools/cafe-solver.cjs): tap a seated cat; its bowl pulls in every coin of its colour joined
// (up/down/left/right) to a coin of that colour on the bottom row. Coins above fall. Next cat in the queue sits down.
// Puzzles: searched with the solver, then hand-picked and checked (solvable; how forgiving the order is).
const LEVELS = [
  { name: 'Opening time', note: 'Easy. Three colours.', rows: [
    'RRRRRG', 'RRBGGG', 'RBBGGG', 'RRBBGG', 'RBBBGG', 'BBBRRG', 'BGBRRR'], queue: 'RGRBRRG' },
  { name: 'Lunch rush', note: 'Big one hiding up top.', rows: [
    'YYYYYYB', 'YYYYRRB', 'YYYYRRG', 'RYYYYGG', 'RBYYYGG', 'RRYYYGG', 'RRBBBBB', 'RBBBBBB'], queue: 'GBRYGBR' },
  { name: 'Yellow wall', note: 'Biggest first is a trap.', rows: [
    'YYYYYYY', 'YYYYYYY', 'RRRRYYY', 'YYYGYBB', 'GYGGGBB', 'GRGGGBB', 'YGGGGRR', 'YGGRRRR'], queue: 'RGRYYBYR' },
  { name: 'Full house', note: 'Five colours. Think ahead.', rows: [
    'GGRRPPP', 'GGRRRPP', 'GRRRRBR', 'GGRRRBR', 'GGRYGRR', 'BGRGGGG', 'BGGPPPG', 'BGGPGPG', 'BGGGGGY'], queue: 'GPYGPRBPY' },
  { name: 'Closing time', note: 'Hard. Two ways to win.', rows: [
    'BBBPPPP', 'YYGGGGB', 'YYGGGRB', 'YYYBBRR', 'YYYRRRR', 'YYYRRRR', 'YYRRBBR', 'GGGBBBB', 'BGGBBBB'], queue: 'BGYRPBPG' },
];
const SEATS = 3;
const ctx = CP.ctx;
const S = { st: 'menu', lv: 0, g: [], R: 0, C: 0, cs: 40, bx: 0, by: 60, seats: [], qi: 0, fly: [], yoff: [], undo: [],
  served: 0, best: 0, msg: '', msgT: 0 };

// ---------- rules ----------
function grabCells(g, k) {
  const R = g.length, C = g[0].length, seen = new Set(), q = [], out = [];
  for (let c = 0; c < C; c++) if (g[R - 1][c] === k) { seen.add((R - 1) * C + c); q.push([R - 1, c, 0]); }
  while (q.length) {
    const [r, c, d] = q.shift(); out.push([r, c, d]);
    for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 < 0 || r2 >= R || c2 < 0 || c2 >= C) continue;
      const id = r2 * C + c2;
      if (!seen.has(id) && g[r2][c2] === k) { seen.add(id); q.push([r2, c2, d + 1]); }
    }
  }
  return out;
}
function boardEmpty() { return S.g.every(r => r.every(v => v < 0)); }

// ---------- layout ----------
function layout() {
  const W = CP.W, H = CP.H;
  const bottom = Math.min(230, Math.max(185, H * 0.27));
  S.cs = Math.floor(Math.min((W - 14) / S.C, (H - 58 - bottom) / S.R));
  S.bx = Math.round((W - S.cs * S.C) / 2);
  S.by = 58 + Math.max(0, Math.round((H - 58 - bottom - S.cs * S.R) / 2));
}
CP.onResize = () => { if (S.C) layout(); };
function cellXY(r, c) { return { x: S.bx + c * S.cs + S.cs / 2, y: S.by + r * S.cs + S.cs / 2 }; }
function edgeY() { return S.by + S.R * S.cs; }
function seatGeom(i) {
  const W = CP.W, H = CP.H, sw = Math.min(140, (W - 16) / SEATS);
  const x = W / 2 + (i - 1) * sw;
  const queueH = 34;
  const headW = sw * 0.86;
  const top = edgeY() + 10;
  const avail = H - queueH - top;
  return { x, sw, headW, headY: top + Math.max(0, (avail - headW * 0.63 - headW * 0.42) / 2), bowlY: 0 };
}

// ---------- level flow ----------
function startLevel(i) {
  const L = LEVELS[i]; S.lv = i;
  S.R = L.rows.length; S.C = L.rows[0].length;
  S.g = L.rows.map(row => row.split('').map(ch => (ch === '.' ? -1 : CP.KEY[ch])));
  S.yoff = S.g.map(r => r.map(() => 0));
  const q = L.queue.split('').map(ch => CP.KEY[ch]);
  S.queue = q; S.seats = q.slice(0, SEATS).map(col => newCat(col, 0)); S.qi = SEATS;
  S.fly = []; S.undo = []; S.served = 0; S.best = 0; S.st = 'play';
  layout(); hideOv(); hud();
}
function newCat(col, delay) { return { col, n: 0, face: 'wait', leave: 0, enter: delay ? 1 : 0, shake: 0, take: 0, jump: 0 }; }
function hud() {
  document.getElementById('hTitle').textContent = S.st === 'menu' ? 'Cat Café' : (S.lv + 1) + '. ' + LEVELS[S.lv].name;
  document.getElementById('bUndo').style.visibility = S.st === 'menu' ? 'hidden' : 'visible';
  document.getElementById('bUndo').disabled = !S.undo.length || S.st !== 'play';
}
function catsLeft() { return S.seats.filter(Boolean).length + (S.queue.length - S.qi); }

function serve(i) {
  const cat = S.seats[i]; if (!cat || S.st !== 'play') return;
  const cells = grabCells(S.g, cat.col);
  if (!cells.length) { cat.shake = 0.5; CP.play('land', 0.6, 0.4); flash('That cat can’t reach any ' + colourName(cat.col) + ' coins'); return; }
  S.undo.push({ g: S.g.map(r => r.slice()), seats: S.seats.map(s => s && s.col), qi: S.qi, served: S.served });
  S.st = 'busy'; S.served++; hud();
  const sg = seatGeom(i);
  const target = { x: sg.x, y: sg.headY + sg.headW * 0.63 + sg.headW * 0.12 };
  CP.payStart(sg.x, sg.headY - 10 > edgeY() - 60 ? edgeY() - 40 : sg.headY - 10);
  cells.sort((a, b) => a[2] - b[2] || b[0] - a[0]);
  const gap = Math.max(0.028, Math.min(0.06, 0.9 / cells.length));
  cells.forEach(([r, c, d], j) => {
    const p = cellXY(r, c);
    S.fly.push({ x0: p.x, y0: p.y, x1: target.x + (Math.random() - 0.5) * sg.headW * 0.3, y1: target.y, ci: S.g[r][c], t: -j * gap, dur: 0.38, cat, idx: j });
    S.g[r][c] = -1;
  });
  cat.take = cells.length; cat.n = 0;
  S.best = Math.max(S.best, cells.length);
  CP.burst(target.x, edgeY(), cat.col, 6, 100);
}
function arrive(f) {
  const cat = f.cat; cat.n++; cat.jump = 1;
  CP.chainTick(cat.n - 1, 0); CP.payAdd(1);
  CP.burst(f.x1, f.y1, f.ci, 3, 90);
  if (cat.n === cat.take) {
    cat.face = cat.take >= 15 ? 'wild' : 'sweet';
    if (cat.take >= 8) { CP.play('spill', 1, 0.7); CP.sparkleStars(CP.pay.x, CP.pay.y, 12 + cat.take); }
    setTimeout(() => { if (S.seats.includes(cat)) cat.leave = 0.0001; }, 450);
  }
}
function gravity() {
  const R = S.R, C = S.C;
  for (let c = 0; c < C; c++) {
    let w = R - 1;
    for (let r = R - 1; r >= 0; r--) {
      if (S.g[r][c] >= 0) {
        if (w !== r) { S.g[w][c] = S.g[r][c]; S.g[r][c] = -1; S.yoff[w][c] = -(w - r) * S.cs; S.yoff[r][c] = 0; }
        w--;
      }
    }
  }
  S.vel = S.g.map(r => r.map(() => 0));
}
function finishServe() {
  // the served cat has left: next one sits down
  const i = S.seats.findIndex(s => s && s.leave >= 1);
  if (i >= 0) S.seats[i] = S.qi < S.queue.length ? Object.assign(newCat(S.queue[S.qi++], 1)) : null;
  gravity(); S.st = 'settle'; S.settleT = 0;
}
function checkEnd() {
  hud();
  if (boardEmpty()) {
    S.st = 'won'; CP.sparkleStars(CP.W / 2, CP.H * 0.35, 70); CP.play('spill', 1.15, 0.9);
    const k = 'cp84-cafe-best-' + S.lv, spare = catsLeft(), b = CP.store(k);
    if (b === null || spare > +b) CP.store(k, String(spare));
    setTimeout(() => { if (S.st === 'won') showWin(); }, 1000); return;
  }
  const live = S.seats.filter(Boolean);
  if (!live.length) { S.st = 'lost'; setTimeout(() => { if (S.st === 'lost') showLose('Out of cats, and coins are still on the counter.'); }, 600); return; }
  if (live.every(s => grabCells(S.g, s.col).length === 0)) { S.st = 'lost'; setTimeout(() => { if (S.st === 'lost') showLose('None of the waiting cats can reach a coin of their colour.'); }, 600); return; }
  S.st = 'play'; hud();
}
function doUndo() {
  if (!S.undo.length || S.st !== 'play') return;
  const u = S.undo.pop();
  S.g = u.g; S.qi = u.qi; S.served = u.served;
  S.seats = u.seats.map(c => (c === null || c === undefined ? null : newCat(c, 0)));
  S.yoff = S.g.map(r => r.map(() => 0));
  CP.play('land', 1.4, 0.3); hud();
}
function colourName(ci) { return ['red', 'blue', 'green', 'yellow', 'purple', 'orange'][ci]; }
function flash(m) { S.msg = m; S.msgT = 2.2; }

// ---------- update / draw ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(dt); requestAnimationFrame(frame);
}
function update(dt) {
  for (let i = S.fly.length - 1; i >= 0; i--) {
    const f = S.fly[i]; f.t += dt;
    if (f.t >= f.dur) { S.fly.splice(i, 1); arrive(f); }
  }
  for (const cat of S.seats) {
    if (!cat) continue;
    cat.shake = Math.max(0, cat.shake - dt); cat.jump = Math.max(0, cat.jump - dt * 6);
    if (cat.enter > 0) cat.enter = Math.max(0, cat.enter - dt * 3.5);
    if (cat.leave > 0 && cat.leave < 1) { cat.leave = Math.min(1, cat.leave + dt * 3); if (cat.leave >= 1) finishServe(); }
  }
  if (S.st === 'settle') {
    let moving = false;
    for (let r = 0; r < S.R; r++) for (let c = 0; c < S.C; c++) {
      if (S.yoff[r][c] < 0) { S.vel[r][c] += 2600 * dt; S.yoff[r][c] = Math.min(0, S.yoff[r][c] + S.vel[r][c] * dt); moving = true; if (S.yoff[r][c] === 0) CP.play('land', 1.6 + Math.random() * 0.3, 0.12); }
    }
    S.settleT += dt;
    if (!moving && S.settleT > 0.3 && S.seats.every(s => !s || s.enter === 0)) checkEnd();
  }
  if (S.msgT > 0) S.msgT -= dt;
  CP.updParts(dt);
}
function drawBG() {
  const W = CP.W, H = CP.H;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4a3226'); g.addColorStop(1, '#22160f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!S.C) return;
  // board tray
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  CP.roundRect(S.bx - 6, S.by - 6, S.cs * S.C + 12, S.cs * S.R + 12, 12); ctx.fill();
  // counter (the open edge)
  const ey = edgeY();
  const cg = ctx.createLinearGradient(0, ey, 0, ey + 14);
  cg.addColorStop(0, '#c98f55'); cg.addColorStop(1, '#8a5a30');
  ctx.fillStyle = cg; ctx.fillRect(0, ey + 4, W, 12);
  ctx.fillStyle = 'rgba(255,230,180,0.5)'; ctx.fillRect(0, ey + 4, W, 2);
}
function drawBowl(x, y, w, col, n) {
  const c = CP.COLORS[col];
  // coins piled in the bowl
  const shown = Math.min(n, 9);
  for (let k = 0; k < shown; k++) {
    const row = k < 4 ? 0 : k < 7 ? 1 : 2, inRow = row === 0 ? 4 : row === 1 ? 3 : 2, idx = row === 0 ? k : row === 1 ? k - 4 : k - 7;
    const cx = x + (idx - (inRow - 1) / 2) * w * 0.17, cy = y - w * 0.04 - row * w * 0.09;
    CP.coin(col, cx, cy, w * 0.1);
  }
  ctx.fillStyle = c.dark;
  ctx.beginPath(); ctx.ellipse(x, y, w * 0.42, w * 0.08, 0, 0, Math.PI * 2); ctx.fill();
  const bg = ctx.createLinearGradient(0, y, 0, y + w * 0.26);
  bg.addColorStop(0, c.base); bg.addColorStop(1, c.dark);
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(x - w * 0.42, y); ctx.quadraticCurveTo(x - w * 0.38, y + w * 0.28, x, y + w * 0.28);
  ctx.quadraticCurveTo(x + w * 0.38, y + w * 0.28, x + w * 0.42, y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(x - w * 0.2, y + w * 0.1, w * 0.08, w * 0.03, -0.3, 0, Math.PI * 2); ctx.fill();
}
function draw(dt) {
  const W = CP.W, H = CP.H;
  drawBG();
  if (S.st === 'menu' || !S.C) { CP.drawParts(); return; }
  const r0 = S.cs * 0.46;
  for (let r = 0; r < S.R; r++) for (let c = 0; c < S.C; c++) {
    const v = S.g[r][c]; if (v < 0) continue;
    const p = cellXY(r, c); CP.coin(v, p.x, p.y + S.yoff[r][c], r0);
  }
  // seats
  for (let i = 0; i < SEATS; i++) {
    const cat = S.seats[i]; const sg = seatGeom(i);
    if (!cat) {
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.font = '600 13px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('empty seat', sg.x, sg.headY + sg.headW * 0.4); continue;
    }
    const preview = S.st === 'play' ? grabCells(S.g, cat.col).length : -1;
    const slide = cat.leave > 0 ? cat.leave : 0, ent = cat.enter;
    const ox = Math.sin(cat.shake * 40) * 6 * (cat.shake > 0 ? 1 : 0);
    const oy = slide * (H - sg.headY + 40) + ent * 160 - cat.jump * 8;
    ctx.save(); ctx.globalAlpha = 1 - slide * 0.6; ctx.translate(ox, oy);
    const im = CP.IMG[cat.face] || CP.IMG.wait; const hw = sg.headW, hh = hw * 0.63;
    if (im && im.width) ctx.drawImage(im, sg.x - hw / 2, sg.headY, hw, hh);
    const by = sg.headY + hh + hw * 0.02;
    drawBowl(sg.x, by, hw, cat.col, S.st === 'play' && cat.n === 0 ? 0 : cat.n);
    // count badge
    const label = cat.take && cat.n ? String(cat.n) : preview >= 0 ? (preview ? '×' + preview : '–') : '';
    if (label) {
      ctx.font = '900 ' + Math.round(hw * 0.15) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(40,20,10,0.85)'; ctx.strokeText(label, sg.x, by + hw * 0.15);
      ctx.fillStyle = preview === 0 ? 'rgba(255,255,255,0.5)' : '#fff'; ctx.fillText(label, sg.x, by + hw * 0.15);
    }
    ctx.restore();
  }
  // flying coins (arc)
  for (const f of S.fly) {
    if (f.t < 0) { CP.coin(f.ci, f.x0, f.y0, r0); continue; }
    const k = f.t / f.dur, e = k * k * (3 - 2 * k);
    const x = f.x0 + (f.x1 - f.x0) * e, y = f.y0 + (f.y1 - f.y0) * e - Math.sin(k * Math.PI) * S.cs * 1.6;
    f.x = x; CP.coin(f.ci, x, y, r0 * (1 - 0.45 * k));
  }
  // queue strip
  const qy = H - 18, rest = S.queue.slice(S.qi);
  ctx.font = '700 12px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(255,246,230,0.75)';
  const lab = rest.length ? 'Next in line:' : 'No more cats in line';
  ctx.fillText(lab, 12, qy);
  const lw = ctx.measureText(lab).width;
  rest.forEach((col, j) => CP.coin(col, 12 + lw + 16 + j * 24, qy, 9));
  // message
  if (S.msgT > 0) {
    ctx.globalAlpha = Math.min(1, S.msgT * 2); ctx.font = '700 14px system-ui'; ctx.textAlign = 'center';
    const tw = ctx.measureText(S.msg).width + 24; ctx.fillStyle = 'rgba(20,10,5,0.85)';
    CP.roundRect(W / 2 - tw / 2, edgeY() + 20, tw, 32, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(S.msg, W / 2, edgeY() + 36); ctx.globalAlpha = 1;
  }
  CP.drawParts(); CP.drawPay(dt);
}

// ---------- input ----------
CP.cv.addEventListener('pointerdown', e => {
  CP.unlockAudio();
  if (S.st !== 'play') return;
  for (let i = 0; i < SEATS; i++) {
    const sg = seatGeom(i);
    if (Math.abs(e.clientX - sg.x) < sg.sw / 2 && e.clientY > edgeY() + 4 && e.clientY < CP.H - 30) { serve(i); return; }
  }
});

// ---------- overlays ----------
const ov = document.getElementById('ov');
function hideOv() { ov.classList.add('hide'); }
function showMenu() {
  S.st = 'menu'; hud();
  const btns = LEVELS.map((L, i) => {
    const b = CP.store('cp84-cafe-best-' + i);
    return `<button class="btn" data-l="${i}">${i + 1}. ${L.name}<small>${b !== null ? 'cleared · ' + b + ' cats spare' : L.note}</small></button>`;
  }).join('');
  ov.innerHTML = `<img src="${IMGS.sweet}" alt=""><h1>Cat Café</h1>
    <p>Tap a cat to serve it. Its bowl pulls in every coin of its colour joined to the counter. Coins above drop down, so pick the order. Clear the board before the cats run out.</p>
    <div class="levels">${btns}</div>`;
  ov.classList.remove('hide');
  ov.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { CP.unlockAudio(); startLevel(+b.dataset.l); });
}
function showWin() {
  const nx = S.lv + 1 < LEVELS.length, spare = catsLeft();
  ov.innerHTML = `<img src="${IMGS.wild}" alt=""><h1>All served!</h1><p>${S.served} cats served, ${spare} spare. Biggest bowl: ${S.best} coins.</p>
    ${nx ? '<button class="btn big" id="oNext">Next puzzle</button>' : '<p>That was the last one.</p>'}
    <button class="btn" id="oAgain">Play again</button><button class="btn" id="oMenu">All puzzles</button>`;
  ov.classList.remove('hide');
  if (nx) document.getElementById('oNext').onclick = () => startLevel(S.lv + 1);
  document.getElementById('oAgain').onclick = () => startLevel(S.lv);
  document.getElementById('oMenu').onclick = showMenu;
}
function showLose(why) {
  ov.innerHTML = `<img src="${IMGS.wait}" alt=""><h1>Not quite</h1><p>${why}</p>
    <button class="btn big" id="oUndo">Undo last cat</button><button class="btn" id="oAgain">Start over</button><button class="btn" id="oMenu">All puzzles</button>`;
  ov.classList.remove('hide');
  document.getElementById('oUndo').onclick = () => { S.st = 'play'; hideOv(); doUndo(); };
  document.getElementById('oAgain').onclick = () => startLevel(S.lv);
  document.getElementById('oMenu').onclick = showMenu;
}
document.getElementById('bMenu').onclick = showMenu;
document.getElementById('bUndo').onclick = doUndo;
const bMute = document.getElementById('bMute');
function muteIcon() { bMute.textContent = CP.muted ? '🔇' : '🔊'; }
bMute.onclick = () => { CP.unlockAudio(); CP.setMuted(!CP.muted); muteIcon(); };
muteIcon();

window.__cp84 = { S, startLevel, serve, LEVELS, seatGeom, grabCells };
CP.loadImages({ wait: IMGS.wait, sweet: IMGS.sweet, wild: IMGS.wild }).then(() => { showMenu(); requestAnimationFrame(frame); });
</script>
</body>
</html>
