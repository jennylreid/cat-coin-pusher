<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Paw Swat</title>
<style>
  :root { --bg: #2a1d3a; --ink: #fff6e6; --panel: #3d2a52; --accent: #ffcf4a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none;
    touch-action: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  canvas { display: block; position: fixed; inset: 0; }
  #hud { position: fixed; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 8px;
    padding: 0 10px; box-sizing: border-box; pointer-events: none; }
  #hud .t { font-weight: 800; font-size: 16px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud .s { font-weight: 700; font-size: 14px; opacity: 0.9; white-space: nowrap; }
  .btn { pointer-events: auto; border: 0; border-radius: 12px; background: var(--panel); color: var(--ink); font: 700 15px system-ui, sans-serif;
    padding: 9px 12px; min-width: 40px; min-height: 40px; }
  .btn.big { background: var(--accent); color: #3b1d0e; font-size: 18px; padding: 14px 22px; border-radius: 16px; }
  #ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(20, 12, 32, 0.82); gap: 14px; padding: 16px; box-sizing: border-box; text-align: center; }
  #ov.hide { display: none; }
  #ov h1 { margin: 0; font-size: 34px; letter-spacing: 0.5px; }
  #ov p { margin: 0; max-width: 340px; line-height: 1.4; font-size: 15px; opacity: 0.92; }
  #ov img { width: 150px; }
  .levels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(340px, 100%); }
  .levels .btn { padding: 14px 8px; font-size: 15px; }
  .levels .btn small { display: block; font-weight: 600; opacity: 0.75; font-size: 12px; margin-top: 3px; }
</style>
</head>

<script>// CP-84 shared helpers: canvas, tinted coins, sounds, payoff counter, particles.
// Inlined into each page by build.py. No game code dependency.
const CP = (function () {
  const COLORS = [
    { k: 'R', base: '#e5484d', light: '#ffb0a8', dark: '#7f1d1d', sym: 'heart' },
    { k: 'B', base: '#3b82f6', light: '#bfdbfe', dark: '#1e3a8a', sym: 'drop' },
    { k: 'G', base: '#22b35e', light: '#bbf7d0', dark: '#14532d', sym: 'leaf' },
    { k: 'Y', base: '#f5b301', light: '#fff1b8', dark: '#8a5a00', sym: 'star' },
    { k: 'P', base: '#a35be8', light: '#ead5ff', dark: '#4c1d95', sym: 'moon' },
    { k: 'O', base: '#f97316', light: '#fed7aa', dark: '#7c2d12', sym: 'fish' },
  ];
  const KEY = {}; COLORS.forEach((c, i) => (KEY[c.k] = i));

  // ---------- canvas ----------
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    coinCache.clear();
  }

  // ---------- coins ----------
  const coinCache = new Map();
  function symbol(g, s, r) {
    g.beginPath();
    const u = r * 0.36;
    if (s === 'heart') {
      g.moveTo(0, u * 0.9);
      g.bezierCurveTo(-u * 1.5, -u * 0.2, -u * 0.6, -u * 1.3, 0, -u * 0.45);
      g.bezierCurveTo(u * 0.6, -u * 1.3, u * 1.5, -u * 0.2, 0, u * 0.9);
    } else if (s === 'drop') {
      g.moveTo(0, -u * 1.1);
      g.quadraticCurveTo(u * 1.1, u * 0.1, 0, u * 0.95);
      g.quadraticCurveTo(-u * 1.1, u * 0.1, 0, -u * 1.1);
    } else if (s === 'leaf') {
      g.moveTo(-u, u * 0.8);
      g.quadraticCurveTo(-u, -u, u, -u);
      g.quadraticCurveTo(u, u * 0.8, -u, u * 0.8);
    } else if (s === 'star') {
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? u * 0.45 : u * 1.05;
        g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.closePath();
    } else if (s === 'moon') {
      g.arc(0, 0, u, Math.PI * 0.25, Math.PI * 1.75, false);
      g.arc(u * 0.55, 0, u * 0.75, Math.PI * 1.6, Math.PI * 0.4, true);
      g.closePath();
    } else if (s === 'fish') {
      g.ellipse(-u * 0.15, 0, u * 0.75, u * 0.5, 0, 0, Math.PI * 2);
      g.moveTo(u * 0.5, 0); g.lineTo(u * 1.1, -u * 0.5); g.lineTo(u * 1.1, u * 0.5); g.closePath();
    }
    g.fill();
  }
  function coinCanvas(ci, r) {
    const key = ci + '_' + Math.round(r * DPR * 2);

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3b2752'); g.addColorStop(1, '#1f1530');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // play area frame
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(S.left, S.top0, 18 * S.r, H - S.top0);
  // ceiling plate (descends)
  const oy = originY();
  const pg = ctx.createLinearGradient(0, S.top0, 0, oy + 6);
  pg.addColorStop(0, '#6b4a2b'); pg.addColorStop(1, '#8a6238');
  ctx.fillStyle = pg; ctx.fillRect(S.left - 4, S.top0 - 6, 18 * S.r + 8, oy - S.top0 + 6);
  ctx.fillStyle = '#4a3019'; ctx.fillRect(S.left - 4, oy - 2, 18 * S.r + 8, 4);
  // danger line
  const dy = S.top0 + S.r + (DANGER - 0.5) * rowH();
  ctx.setLineDash([8, 8]); ctx.strokeStyle = 'rgba(255,120,120,0.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(S.left, dy); ctx.lineTo(S.left + 18 * S.r, dy); ctx.stroke(); ctx.setLineDash([]);
}
function draw(dt) {
  const W = CP.W, H = CP.H;
  ctx.save();
  if (S.shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 4);
  drawBG();
  if (S.st !== 'menu') {
    for (let r = 0; r < MAXROWS; r++) for (let c = 0; c < colsOf(r); c++) {
      const v = S.grid[r][c]; if (v < 0) continue;
      const p = cellXY(r, c); CP.coin(v, p.x, p.y, S.r * 0.97);
    }
    for (const a of S.anims) {
      const p = cellXY(0, 0);
      if (a.t < 0) CP.coin(a.ci, a.x, a.y, S.r * 0.97);
      else CP.coin(a.ci, a.x, a.y, S.r * 0.97, 1 - a.t / 0.25, 1 + a.t * 2.5);
    }
    for (const f of S.falls) CP.coin(f.ci, f.x, f.y, S.r * 0.97);
    // aim
    if (S.st === 'aim' && S.aim !== null) {
      const pts = aimPath(S.aim);
      ctx.fillStyle = CP.COLORS[S.cur].light;
      pts.forEach((p, i) => { if (i % 2 === 0) { ctx.globalAlpha = 0.9 - i / pts.length * 0.5; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(2, S.r * 0.16), 0, Math.PI * 2); ctx.fill(); } });
      ctx.globalAlpha = 1;
    }
    if (S.ball) CP.coin(S.ball.ci, S.ball.x, S.ball.y, S.r * 0.97);
    drawShooter();
  }
  CP.drawParts();
  CP.drawPay(dt);
  ctx.restore();
}
function drawShooter() {
  const sp = shooterPos(), W = CP.W, H = CP.H;
  const im = CP.IMG[S.face === 'wild' ? 'wild' : S.st === 'won' ? 'sweet' : 'wait'];
  const hw = Math.min(150, W * 0.36), hh = im && im.width ? hw * im.height / im.width : hw * 0.63;
  if (im && im.width) ctx.drawImage(im, sp.x - hw / 2, H - hh - 6, hw, hh);
  // paw beside the head, swings up when firing
  const paw = CP.IMG.paw;
  if (paw && paw.width) {
    const pw = hw * 0.3, ph = pw * paw.height / paw.width;
    ctx.save(); ctx.translate(sp.x + hw * 0.56, H - 8);
    ctx.rotate(0.35 - S.swat * 0.9); ctx.drawImage(paw, -pw / 2, -ph - S.swat * 14, pw, ph); ctx.restore();
  }
  // current coin
  if (S.st === 'aim' || S.st === 'fly' || S.st === 'resolve') {
    if (S.cur >= 0 && S.st !== 'fly') CP.coin(S.cur, sp.x, sp.y - S.r * 1.2, S.r * 1.05);
    else if (S.cur >= 0) CP.coin(S.cur, sp.x, sp.y - S.r * 1.2, S.r * 1.05, 0.5);
    const np = nextPos();
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.arc(np.x, np.y, S.r * 1.25, 0, Math.PI * 2); ctx.fill();
    if (S.nxt >= 0) CP.coin(S.nxt, np.x, np.y, S.r * 0.85);
    ctx.fillStyle = 'rgba(255,246,230,0.75)'; ctx.font = '700 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('NEXT · tap to swap', np.x, np.y - S.r * 1.45);
  }
}

// ---------- input ----------
let downAt = null;
CP.cv.addEventListener('pointerdown', e => {
  CP.unlockAudio();
  if (S.st !== 'aim') return;
  const np = nextPos();
  if (Math.hypot(e.clientX - np.x, e.clientY - np.y) < S.r * 1.8) {
    const t = S.cur; S.cur = S.nxt; S.nxt = t; CP.play('land', 1.8, 0.3); return;
  }
  downAt = { x: e.clientX, y: e.clientY };
  const sp = shooterPos(); S.aim = clampAngle(e.clientX - sp.x, e.clientY - (sp.y - S.r * 1.2));
});
CP.cv.addEventListener('pointermove', e => {
  if (S.st !== 'aim' || !downAt) return;
  const sp = shooterPos(); S.aim = clampAngle(e.clientX - sp.x, e.clientY - (sp.y - S.r * 1.2));
});
CP.cv.addEventListener('pointerup', e => {
  if (S.st !== 'aim' || !downAt) { downAt = null; return; }
  downAt = null;
  if (e.clientY > shooterPos().y + 10 && Math.abs(e.clientX - shooterPos().x) < 40) { S.aim = null; return; } // cancel by releasing on the cat
  fire(S.aim); S.aim = null;
});
CP.cv.addEventListener('pointercancel', () => { downAt = null; S.aim = null; });

// ---------- overlays ----------
const ov = document.getElementById('ov');
function hideOv() { ov.classList.add('hide'); }
function bestKey(i) { return 'cp84-swat-best-' + i; }
function saveBest() { const b = +CP.store(bestKey(S.lv)) || 0; if (!b || S.shots < b) CP.store(bestKey(S.lv), String(S.shots)); }
function showMenu() {
  S.st = 'menu'; hud();
  const btns = LEVELS.map((L, i) => {
    const b = CP.store(bestKey(i));
    return `<button class="btn" data-l="${i}">${i + 1}. ${L.name}<small>${b ? 'best ' + b + ' shots' : L.note}</small></button>`;
  }).join('');
  ov.innerHTML = `<img src="${IMGS.wait}" alt=""><h1>Paw Swat</h1>
    <p>Drag to aim, let go to swat a coin up. 3 or more of one colour clear, and anything hanging from them drops.</p>
    <div class="levels">${btns}</div>`;
  ov.classList.remove('hide');
  ov.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { CP.unlockAudio(); startLevel(+b.dataset.l); });
}
function showWin() {
  const nx = S.lv + 1 < LEVELS.length;
  ov.innerHTML = `<img src="${IMGS.sweet}" alt=""><h1>Cleared!</h1><p>${S.shots} shots.</p>
    ${nx ? '<button class="btn big" id="oNext">Next puzzle</button>' : '<p>That was the last one.</p>'}
    <button class="btn" id="oAgain">Play again</button><button class="btn" id="oMenu">All puzzles</button>`;
  ov.classList.remove('hide');
  if (nx) document.getElementById('oNext').onclick = () => startLevel(S.lv + 1);
  document.getElementById('oAgain').onclick = () => startLevel(S.lv);
  document.getElementById('oMenu').onclick = showMenu;
}
function showLose() {
  ov.innerHTML = `<img src="${IMGS.wait}" alt=""><h1>Too low!</h1><p>The wall crossed the red line.</p>
    <button class="btn big" id="oAgain">Try again</button><button class="btn" id="oMenu">All puzzles</button>`;
  ov.classList.remove('hide');
  document.getElementById('oAgain').onclick = () => startLevel(S.lv);
  document.getElementById('oMenu').onclick = showMenu;
}
document.getElementById('bMenu').onclick = showMenu;
const bMute = document.getElementById('bMute');
function muteIcon() { bMute.textContent = CP.muted ? '🔇' : '🔊'; }
bMute.onclick = () => { CP.unlockAudio(); CP.setMuted(!CP.muted); muteIcon(); };
muteIcon();

// test hook (used by the capture script only)
// bot helper for the capture script: what would a shot at angle a clear?
function evalShot(a) {
  const p = shooterPos(); const b = { x: p.x, y: p.y - S.r * 1.2, vx: Math.cos(a), vy: Math.sin(a), bounces: 0 };
  let k = 0; while (!stepBall(b, S.r * 0.5) && k < 600) k++;
  const cell = snap(b); if (!cell) return { n: 0, drop: 0, row: 99 };
  const [row, c] = cell; S.grid[row][c] = S.cur; const g = group(row, c); let n = g.length, drop = 0;
  if (n >= 3) { const sv = g.map(([r, cc]) => [r, cc, S.grid[r][cc]]); for (const [r, cc] of g) S.grid[r][cc] = -1; drop = floaters().length; for (const [r, cc, v] of sv) S.grid[r][cc] = v; }
  S.grid[row][c] = -1; return { n, drop, row, bounces: b.bounces };
}
window.__cp84 = { S, startLevel, fire, LEVELS, cellXY, aimPath, evalShot, shooterPos };
CP.loadImages({ wait: IMGS.wait, sweet: IMGS.sweet, wild: IMGS.wild, paw: IMGS.paw }).then(() => {
  layout(); showMenu(); requestAnimationFrame(frame);
});
</script>
