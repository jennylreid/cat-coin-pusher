<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAT-17 all dances and continuous drums</title>
<style>body{margin:12px auto;max-width:440px;background:#150f20;color:#fff;font:16px system-ui}button{font:inherit;padding:8px}#stage{position:relative;width:min(100%,400px);margin:auto}video{display:block;width:100%}video[hidden]{display:none}.paw{position:absolute;top:34%;height:17%;width:39%;background:transparent;border:2px dashed #ffda3588;border-radius:45%;cursor:pointer}.left{left:0}.right{right:0}p,h2{padding:0 12px}#status{min-height:3em}</style>
<h2>All three happy dances</h2><p>Tap either outlined paw: paw pumps → shimmy → hops. The drums keep their beat through paw taps. Tap anywhere outside the paws to stop the drums. Each dance finishes in rest. Concept preview only.</p>
<div id="stage"><video src="bigger-1.mp4" playsinline muted preload="auto"></video><video src="bigger-2.mp4" playsinline muted preload="auto" hidden></video><video src="bigger-3.mp4" playsinline muted preload="auto" hidden></video><button class="paw left" aria-label="Tickle left paw"></button><button class="paw right" aria-label="Tickle right paw"></button></div>
<p><button id="stop">Stop drums</button> <span id="count">0 taps</span></p><p id="status" role="status">Ready. Tap either paw.</p>
<script>
const clips=[...document.querySelectorAll('video')],status=document.querySelector('#status'),audio=new Audio('lets-dance-full.mp3'),names=['Paw pumps','Shimmy','Happy hops'];let taps=0,active=clips[0];
function stopDrums(){audio.pause();audio.currentTime=0;status.textContent='Drums stopped. Any current dance finishes in rest.';}
function tap(){
 const index=taps%3;clips.forEach(v=>{v.pause();v.hidden=true;});active=clips[index];active.hidden=false;active.currentTime=.35;
 if(audio.paused){const p=audio.play();if(p)p.catch(()=>status.textContent='Audio could not play. Tap again.');}
 active.play().catch(()=>{});document.querySelector('#count').textContent=(++taps)+' taps';status.textContent=names[index]+' · drums continue. Tap outside the paws to stop sound.';
}
document.querySelectorAll('.paw').forEach(p=>p.onclick=tap);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.paw'))stopDrums();});
document.querySelector('#stop').onclick=stopDrums;
clips.forEach(v=>v.onended=()=>{if(v===active)status.textContent=audio.paused?'Resting. Tap a paw for the next dance.':'Resting; drums continue. Tap a paw for the next dance or outside to stop sound.';});
audio.onended=()=>status.textContent='Track finished. Tap a paw to start it again.';
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopDrums();clips.forEach(v=>{v.pause();v.currentTime=0;});}});
</script></html>
