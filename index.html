<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cat Coin Pusher</title>
<style>
html,body{margin:0;height:100%;background:#064e4a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif}
canvas{display:block;margin:0 auto}
#panel{position:absolute;inset:0;background:rgba(14,8,26,.94);display:none;color:#f4ecff;padding:20px 16px;box-sizing:border-box;overflow:auto}
#panel h2{margin:0 0 12px;font-size:22px}
.set{background:#2a1f3d;border-radius:12px;padding:12px;margin-bottom:12px}
.set h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.it{background:#3a2d52;border-radius:10px;text-align:center;padding:8px 2px;font-size:12px}
.it b{display:block;font-size:30px;font-weight:400}
.it.no{opacity:.3;filter:grayscale(1)}
.reward{font-size:13px;margin-top:8px;color:#c9b8e8}
.reward.on{color:#ffd76a}
#close{position:sticky;top:0;float:right;background:#ffd76a;color:#3a2600;border:0;border-radius:8px;padding:8px 14px;font-size:15px}
.dev{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dev button{background:#3a2d52;color:#f4ecff;border:1px solid #6b5a8a;border-radius:8px;padding:8px 10px;font-size:14px}
.dev button.on{border-color:#ffd76a;color:#ffd76a}
.dev button:active{transform:scale(.94);background:#5a4a7a}
.dev button.done{background:#ffd76a;color:#3a2600;border-color:#ffd76a}
.devswitch{display:block;margin:22px auto 4px;background:none;color:#8a7aa8;border:1px solid #4a3d62;border-radius:8px;padding:6px 12px;font-size:12px}
.wide{display:block;width:100%;margin:4px 0 14px;background:#3a2d52;color:#f4ecff;border:1px solid #6b5a8a;border-radius:10px;padding:12px;font-size:16px}
.wide:active{transform:scale(.97);background:#5a4a7a}
#newtable{display:block;width:100%;margin-top:18px;background:#3a2d52;color:#ffd76a;border:1px solid #ffd76a;border-radius:10px;padding:12px;font-size:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel"></div>
<!-- Rapier 3D physics engine (Apache 2.0, lib/RAPIER-LICENSE.txt), wrapped so it sets window.RAPIER. -->
<script src="lib/rapier.js"></script>
<script>
'use strict';
// The table is simulated in 3D by Rapier: coins are real thin cylinders with weight and friction, the tongue is a
// moving block, and the table, side walls and the back wall above the tongue are solid. Game units: x across the
// table (T.L..T.R), y = depth from the back (PUSH_BACK) to the front edge (T.FRONT), h = height above the table.
// Rapier works in metres (M per unit). Drawing projects everything into the slanted view of Jenny's art (proj()).
const W = 400;
let H = 720; // grows on tall phones; the extra height is empty space below the bucket
const T = { L: 30, R: 370, BACK: 190, FRONT: 640 };
const PAY_L = 60, PAY_R = 340; // the bucket's edges: coins off the table past these miss it
// The tongue (pusher) slides between PUSH_MIN and PUSH_MAX; its back runs under the back wall at PUSH_BACK, which
// scrapes coins off it as it pulls back, so they spill over its front edge onto the table.
// (a short stroke, so little bare table is left between the tongue and the coins in front of it, and the tongue is
// never more than a third bare; the back wall sits right under the cat's upper lip, so coins fill the tongue)
const PUSH_BACK = -25, TONGUE_H = 18, TONGUE_LEN = 300;
const PUSH_HALF=170, LEDGE_BACK=205;
let PUSH_MIN = 205, PUSH_MAX = 275, PUSH_PERIOD = 3.2;
const COIN_R = 26, LUCKY_R = 28, ITEM_R = 30; // big coins: more action per coin, and fewer for the phone to simulate
const COIN_HALF = 2, LUCKY_HALF = 3.5, ITEM_HALF = 9; // half thicknesses
// Bonus chips: big, thick, coloured, with a scalloped edge and their value (5x, 10x) printed on them.
const BONUS = { x5: { r: 36, half: 3.5, value: 5 }, x10: { r: 40, half: 4, value: 10 } };
// Flat and boxy things on the table (half sizes across, up, deep): arcade ticket strips, dollar bills, Rubik's cubes.
const BOX = {
  ticket: { hx: 26, hy: 1.2, hz: 11, density: 0.5 },
  cash: { hx: 32, hy: 1, hz: 14, density: 0.5 },
  cube: { hx: 12, hy: 12, hz: 12, density: 0.8 },
};
// what each thing is worth in coins when it lands in the bucket (tickets count separately)
const VALUE = { coin: 1, silver: 1, smiley: 2, clover: 3, rainbow: 20, bolt: 1, shower: 1, lucky: 10, x5: 5, x10: 10, toycoin: 2, joker: 5,
  cash: 25, cube: 15, ticket: 0 };
const TICKETS_PER_STRIP = 10;
// how each kind is written in a save (one character each)
const SAVE_CODE = { coin: 'c', lucky: 'l', item: 'i', power: 'p', x5: '5', x10: 't', stack: 's', silver: 'a', clover: 'o',
  rainbow: 'b', smiley: 'y', bolt: 'z', shower: 'h', ticket: 'q', cash: 'd', cube: 'u', toycoin: 'g', joker: 'j' };
// Heavy metal coins: strong gravity, little air drag (COIN_DAMP), stiff contacts, almost no bounce.
// (some drag is still needed: without it coins never quite come to rest, and resting coins cost nothing to simulate)
// The table tilts toward the player (TILT_DEG) only while you're playing: from each drop for ACTIVE_SEC, easing
// back to flat after. Flat, the coins stay put even though the tongue keeps moving (Jenny: "this is not a conveyor
// belt" — coins move when you drop coins, or shake). Without the tilt pushes make piles instead of payouts.
const ACTIVE_SEC = 2, IDLE_DAMP = 4, MOUTH_DROP_SEC = 0.42, MOUTH_REVEAL_SEC = 0.1;
const M = 0.01, GRAVITY = 30, TILT_DEG = 0, STEP = 1 / 60, COIN_DAMP = 0.8, COIN_SPIN_DAMP = 2.5, COIN_BOUNCE = 0;
// The tongue is slippery like a steel shelf: when it pulls back, coins on it mostly stay put, so the front ones
// drop off its edge.
// Min combining keeps the effective coin/shelf (.035) and coin/pusher (.05) grip at their former values.
const COIN_FRICTION = 0.45, TABLE_FRICTION = 0.035, TONGUE_FRICTION = 0.05, TOY_GRIP = 0.035;
const GUARD_SEC = 30, START_COINS = 100, REGEN_SEC = 20, REGEN_CAP = 100;
const KEY = 'catpusher.board.prototype.v1', OLD_KEY = KEY;
// Collection sets. Three are on show at a time (S.active); finishing one pays out and the next set in this list
// takes its place, so there's always something new to collect.
const SETS = [
  { name: 'Cat toys', reward: 'Yarn wallpaper', items: [['yarn', '🧶', 'Yarn ball'], ['mouse', '🐭', 'Toy mouse'], ['feather', '🪶', 'Feather wand'], ['bell', '🔔', 'Jingle bell']] },
  { name: 'Snacks', reward: 'Fish wallpaper', items: [['fish', '🐟', 'Fish'], ['milk', '🥛', 'Milk'], ['shrimp', '🍤', 'Shrimp'], ['cheese', '🧀', 'Cheese']] },
  { name: 'Fancy', reward: 'Royal cat wallpaper', items: [['crown', '👑', 'Crown'], ['bow', '🎀', 'Bow'], ['hat', '🎩', 'Top hat'], ['gem', '💎', 'Gem']] },
  { name: 'Garden', reward: 'Garden wallpaper', items: [['sunflower', '🌻', 'Sunflower'], ['ladybug', '🐞', 'Ladybug'], ['mushroom', '🍄', 'Mushroom'], ['butterfly', '🦋', 'Butterfly']] },
  { name: 'Sweets', reward: 'Candy wallpaper', items: [['donut', '🍩', 'Donut'], ['cookie', '🍪', 'Cookie'], ['cupcake', '🧁', 'Cupcake'], ['lollipop', '🍭', 'Lollipop']] },
  { name: 'Ocean', reward: 'Ocean wallpaper', items: [['octopus', '🐙', 'Octopus'], ['shell', '🐚', 'Shell'], ['crab', '🦀', 'Crab'], ['tropical', '🐠', 'Tropical fish']] },
  { name: 'Music', reward: 'Jazz cat wallpaper', items: [['guitar', '🎸', 'Guitar'], ['trumpet', '🎺', 'Trumpet'], ['drum', '🥁', 'Drum'], ['keys', '🎹', 'Keyboard']] },
  { name: 'Space', reward: 'Space cat wallpaper', items: [['rocket', '🚀', 'Rocket'], ['planet', '🪐', 'Planet'], ['moon', '🌙', 'Moon'], ['star', '⭐', 'Star']] },
  { name: 'Treasure', reward: 'Golden cat wallpaper', items: [['moneybag', '💰', 'Money bag'], ['key', '🗝️', 'Old key'], ['trophy', '🏆', 'Trophy'], ['ring', '💍', 'Ring']] },
];
const ITEMS = {};
for (const s of SETS) for (const [id, emoji, name] of s.items) ITEMS[id] = { emoji, name, set: s };
const SET_REWARD = { coins: 150, shakes: 2 }; // for finishing a set

function rand(a, b) { return a + Math.random() * (b - a); }
function activeSets() {
  if (!Array.isArray(S.active) || !S.active.length) S.active = SETS.slice(0, 3).map(s => s.name);
  return S.active.map(n => SETS.find(s => s.name === n)).filter(Boolean);
}
// a prize from the sets on show, usually one you don't have yet
function pickItem() {
  const ids = activeSets().flatMap(s => s.items.map(([i]) => i)), need = ids.filter(i => !S.got[i]);
  const from = need.length && Math.random() < 0.7 ? need : ids;
  return from[(Math.random() * from.length) | 0];
}
function radius(kind) {
  if (BOX[kind]) return Math.max(BOX[kind].hx, BOX[kind].hz);
  return BONUS[kind] ? BONUS[kind].r : kind === 'item' || kind === 'power' ? ITEM_R : kind === 'lucky' ? LUCKY_R : COIN_R;
}
function halfOf(kind) {
  if (BOX[kind]) return BOX[kind].hy;
  return BONUS[kind] ? BONUS[kind].half : kind === 'item' || kind === 'power' ? ITEM_HALF : kind === 'lucky' ? LUCKY_HALF : COIN_HALF;
}

// ---------- perspective ----------
// Fitted to the table in Jenny's picture: the back edge is 58% the width of the front edge. A unit of height lifts
// a point LIFT units up the screen; a unit toward the viewer moves it SQUASH units down (both times the depth scale).
const ART_ZX = 1.2; // how much wider than the picture the machine is drawn (see artX)
const P_K = 0.73, P_H = 823, P_Y0 = -244, P_X = 0.9 * ART_ZX, SQUASH = 0.6, LIFT = 0.85;
const FRONT_Y = 579;
function depthScale(y) { return 1 / (1 + P_K * (1 - (y - T.BACK) / (T.FRONT - T.BACK))); }
function proj(x, y) { const s = depthScale(y); return { x: 200 + (x - 200) * s * P_X, y: P_Y0 + P_H * s, s: s * P_X }; }
function unprojX(sx, y) { return 200 + (sx - 200) / (depthScale(y) * P_X); }
function screenOf(x, y, h) { const p = proj(x, y); return { x: p.x, y: p.y - h * LIFT * p.s, s: p.s, worldX:x, depth:y, height:h }; }
// a small 3D direction (x across, y up, z toward the front) as a screen offset at depth scale s
function projVec(v, s, at) {
 if(at){
  // Coin faces use the same local perspective as their board positions.
  const ds=P_K/(T.FRONT-T.BACK)*depthScale(at.depth)**2;
  return {x:v.x*s+(at.worldX-200)*P_X*ds*v.z,
   y:-v.y*LIFT*s+(P_H-at.height*LIFT*P_X)*ds*v.z};
 }
 return { x: v.x * s, y: (v.z * SQUASH - v.y * LIFT) * s };
}
function qrot(q, v) {
  const ix = q.w * v.x + q.y * v.z - q.z * v.y, iy = q.w * v.y + q.z * v.x - q.x * v.z;
  const iz = q.w * v.z + q.x * v.y - q.y * v.x, iw = -q.x * v.x - q.y * v.y - q.z * v.z;
  return {
    x: ix * q.w + iw * -q.x + iy * -q.z - iz * -q.y,
    y: iy * q.w + iw * -q.y + iz * -q.x - ix * -q.z,
    z: iz * q.w + iw * -q.z + ix * -q.y - iy * -q.x,
  };
}
// a rotation about the up axis (yaw), tipped by `tilt` radians toward a random direction
function qmul(a, b) {
  return {
    x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y,
    y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x,
    z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w,
    w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z,
  };
}
function yawTurn(a) { return { x: 0, y: Math.sin(a / 2), z: 0, w: Math.cos(a / 2) }; }
function randomTurn(tilt) {
  const yaw = rand(0, Math.PI * 2), a = rand(0, Math.PI * 2), s = Math.sin(tilt / 2);
  const t = { x: Math.cos(a) * s, y: 0, z: Math.sin(a) * s, w: Math.cos(tilt / 2) };
  const y = { x: 0, y: Math.sin(yaw / 2), z: 0, w: Math.cos(yaw / 2) };
  return { // t * y
    x: t.w * y.x + t.x * y.w + t.y * y.z - t.z * y.y,
    y: t.w * y.y - t.x * y.z + t.y * y.w + t.z * y.x,
    z: t.w * y.z + t.x * y.y - t.y * y.x + t.z * y.w,
    w: t.w * y.w - t.x * y.x - t.y * y.y - t.z * y.z,
  };
}

// ---------- state ----------
let S = { coins: START_COINS, won: 0, drops: 0, lastRegen: Date.now(), got: {}, sets: {}, muted: false, guard: 0, table: null,
  active: null, xp: 0, level: 1, shakes: 2, quest: null, questNext: 0, daily: null, tickets: 0 };
let world = null, tongue = null, tongueContact = null, tongueRest = null, sweepBody=null, sweepCollider=null, bodies = [], falling = [], floats = [], winTimes = [], rings = [];
let sweepTime=0, pupilAim=200;
const SWEEP_START=PUSH_MIN-12, SWEEP_END=T.FRONT+80, SWEEP_DURATION=2.4;
let pusherY = PUSH_MIN, tongueDrawY = PUSH_MIN, time = 0, lastDrop = -99, tiltNow = 0, calm = false;
let pushPhase = 0, pushLoaded = false, pushPending = false;
// Aiming: you choose only left/right. Coins always drop onto the tongue, on a line near its back just in front of
// the back wall (DROP_Y), so each new coin lands behind the coins already there and helps push them forward.
const DROP_Y = PUSH_MIN + COIN_R + 5, DROP_H = 35;
let pendingDrops = [], releaseAt = 0;
let aim = { x: 200, y: DROP_Y }, aimShow = 0, guardAnim = 0;
let holding = false, holdPos = aim, taps = [], dropTimer = 0, saveTimer = 0, lastChaching = 0;
// test-build readout at the bottom of the screen: physics time per step (ms) and frames per second, smoothed
const perf = { step: 0, fps: 60 };
// when this version was published (publish_game.ps1 fills it in), shown in the readout
const BUILD = 'Oct 10, 10:12 PM · board preview';

function initPhysics() {
  // the table tilts gently down toward the player (TILT_DEG): coins at rest stay put, but a push moves them
  // forward instead of up into piles, so the table builds up and then avalanches over the edge
  world = new RAPIER.World({ x: 0, y: -GRAVITY, z: 0 }); // flat until you drop (see ACTIVE_SEC)
  world.timestep = STEP;
  // Six solver passes keep contacts firm; unchanged by the priority-1 motion work.
  world.integrationParameters.numSolverIterations = 6;
  world.integrationParameters.numAdditionalFrictionIterations = 1;
  // stiffer contacts (Rapier's default lets resting coins sink into each other a little, which looks soft)
  if ('contact_natural_frequency' in world.integrationParameters) world.integrationParameters.contact_natural_frequency = 60;
  const fixed = world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
  const box = (hx, hy, hz, x, h, y, fr) => world.createCollider(
    RAPIER.ColliderDesc.cuboid(hx * M, hy * M, hz * M).setTranslation(x * M, h * M, y * M).setFriction(fr), fixed);
  const halfW = (T.R - T.L) / 2;
  box(halfW + 40, 10, (T.FRONT + 100) / 2, 200, -10, (T.FRONT - 100) / 2, TABLE_FRICTION); // table top, open at the front
  box(10, 200, (T.FRONT + 100) / 2, T.L - 10, 190, (T.FRONT - 100) / 2, 0.2);               // side walls
  box(10, 200, (T.FRONT + 100) / 2, T.R + 10, 190, (T.FRONT - 100) / 2, 0.2);
  box(halfW + 40, 150, 12, 200, TONGUE_H + 150, LEDGE_BACK - 12, 0.2); // upper ledge backstop prevents coins retreating into the throat
  tongue = world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased()
    .setTranslation(200 * M, TONGUE_H / 2 * M, (pusherY - TONGUE_LEN / 2) * M));
  tongueContact = world.createCollider(RAPIER.ColliderDesc.cuboid(PUSH_HALF * M, TONGUE_H / 2 * M, TONGUE_LEN / 2 * M)
    .setFriction(TONGUE_FRICTION).setSensor(false), tongue);
  // When unloaded, the sliding tongue slips under the resting mat. A stationary backing
  // supports it at the retracted footprint; the moving tray only transmits a loaded push.
  tongueRest = box(PUSH_HALF, TONGUE_H / 2, TONGUE_LEN / 2,
    200, TONGUE_H / 2, PUSH_MIN - TONGUE_LEN / 2, TONGUE_FRICTION);
  tongueRest.setEnabled(false);
  sweepBody=world.createRigidBody(RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(2,.12,SWEEP_START*M));
  sweepCollider=world.createCollider(RAPIER.ColliderDesc.cuboid(halfW*M,.12,.08).setFriction(.05),sweepBody);
  sweepCollider.setEnabled(false);
}

// The collision shape of a coin: a rounded cylinder (measured fastest and smoothest), or for testing a plain
// cylinder or a SHAPE_SIDES-sided prism.
let SHAPE = 'round', SHAPE_SIDES = 10;
function coinShape(r, half, edge) {
  if (SHAPE === 'round') return RAPIER.ColliderDesc.roundCylinder((half - edge) * M, (r - edge) * M, edge * M);
  if (SHAPE === 'cyl') return RAPIER.ColliderDesc.cylinder(half * M, r * M);
  const pts = [];
  for (let i = 0; i < SHAPE_SIDES; i++) {
    const a = i / SHAPE_SIDES * Math.PI * 2;
    for (const y of [-half, half]) pts.push(Math.cos(a) * r * M, y * M, Math.sin(a) * r * M);
  }
  return RAPIER.ColliderDesc.convexHull(new Float32Array(pts));
}

// A coin (or prize). Position in game units; rot/linvel/angvel optional.
let uids = 0;
function addCoin(kind, id, x, h, y, rot, linvel, angvel) {
  const r = radius(kind), half = halfOf(kind), edge = Math.min(half * 0.6, 1.2);
  const desc = RAPIER.RigidBodyDesc.dynamic().setTranslation(x * M, h * M, y * M)
    .setLinearDamping(COIN_DAMP).setAngularDamping(COIN_SPIN_DAMP).setCanSleep(true);
  if (rot) desc.setRotation(rot);
  if (linvel) desc.setLinvel(linvel.x, linvel.y, linvel.z);
  if (angvel) desc.setAngvel(angvel);
  const rb = world.createRigidBody(desc);
  const bx = BOX[kind];
  world.createCollider((bx ? RAPIER.ColliderDesc.cuboid(bx.hx * M, bx.hy * M, bx.hz * M) : coinShape(r, half, edge))
    // toys are heavy and grippy, so they wedge in and get stuck (that's what shakes are for)
    .setFriction(kind === 'item' || bx ? TOY_GRIP : COIN_FRICTION).setRestitution(COIN_BOUNCE)
    // Grip between coins supports piles; the lower surface coefficient keeps the shelf and pusher slippery.
    .setFrictionCombineRule(RAPIER.CoefficientCombineRule.Min)
    .setDensity(bx ? bx.density * 2 : kind === 'item' ? 1.6 : kind === 'power' ? 1 : 3), rb);
  // quest: a toy the quest is about; sortK, uid: drawing order (see draw)
  const b = { rb, kind, id: id || null, r, half, dead: false, vy: 0, fresh: false, quest: false, sortK: null, uid: ++uids };
  bodies.push(b);
  return b;
}

// One isolated, deterministic board. Campaign and collection economy are deliberately absent.
const BOARDS = Object.freeze([
 {id:'snack-shelf',name:'Board 1',seed:42,coins:140,seconds:90,
  targets:[{id:'cheese',x:140,y:490},{id:'shrimp',x:260,y:570}],
  towers:[{x:200,y:420,n:10}]},
 {id:'twin-towers',name:'Board 2',seed:137,coins:160,seconds:110,
  targets:[{id:'cheese',x:260,y:510},{id:'shrimp',x:132,y:580}],
  towers:[{x:115,y:465,n:8},{x:285,y:390,n:12}]}
]);
let boardIndex=0, BOARD=BOARDS[0];
let board = {status:'ready', remaining:BOARD.coins, elapsed:0, collected:[], used:0};
let boardRandom = BOARD.seed;
function seededRandom() { boardRandom=boardRandom*16807%2147483647; return (boardRandom-1)/2147483646; }
function finishBoard(status,reason) {
 if(board.status==='won'||board.status==='lost')return;
 board.status=status;board.endReason=reason||'targets'; holding=false; taps=[];pendingDrops=[];
 if(status==='won') { callout('BOARD CLEAR!', {voice:'quest',color:'#7dff6a',afterCollections:true}); }
 else {sfx.empty();callouts=[];callout('TRY AGAIN', {color:'#ffb98b',dur:Infinity});}
}
function boardTick(dt) {
 if(board.status!=='playing' && board.status!=='settling')return;
 board.elapsed+=dt;
 if(board.elapsed>=BOARD.seconds) {finishBoard('lost','time');return;}
 if(board.remaining===0) {
   board.status='settling';
   const moving=bodies.some(b=>{const v=b.rb.linvel();return Math.hypot(v.x,v.y,v.z)>.01;});
   board.quiet=(!moving&&!pushLoaded&&!pushPending&&!pendingDrops.length&&sweepTime===0)?(board.quiet||0)+dt:0;
   if(board.quiet>=3)finishBoard('lost','coins');
 }
}
function selectBoard(index) {
 if(!Number.isInteger(index)||index<0||index>=BOARDS.length)return false;
 boardIndex=index;BOARD=BOARDS[index];resetBoard();return true;
}
function nextBoard(){if(board.status!=='won'||boardIndex>=BOARDS.length-1)return false;return selectBoard(boardIndex+1);}
function resetBoard() {
 pushCoinSoundPlayed=false;
 recordedSfx.reset();
 for(const b of bodies.slice())removeCoin(b);
 board={status:'ready',remaining:BOARD.coins,elapsed:0,collected:[],used:0,released:0,sweeps:0};boardRandom=BOARD.seed;
 S.coins=BOARD.coins;S.shakes=0;S.quest=null;S.guard=0;
 time=0;lastDrop=-99;pushPhase=0;pushLoaded=false;pushPending=false;calm=false;tiltNow=0;
 pusherY=PUSH_MIN;tongueDrawY=PUSH_MIN;
 tongue.setTranslation({x:2,y:TONGUE_H/2*M,z:(PUSH_MIN-TONGUE_LEN/2)*M},true);
 tongueContact.setSensor(false);tongueRest.setEnabled(false);world.gravity={x:0,y:-GRAVITY,z:0};
 sweepTime=0;sweepCollider.setEnabled(false);sweepBody.setTranslation({x:2,y:.12,z:SWEEP_START*M},true);pupilAim=200;aim={x:200,y:DROP_Y};
 holding=false;taps=[];toyQueue=[];falling=[];rings=[];floats=[];callouts=[];itemToasts=[];pendingDrops=[];releaseAt=0;

// ---------- towers ----------
// A tall stack of thin coins can't balance in the physics engine (it wobbles itself over), so a tower is one solid
// column, drawn as its coins. It stands until something really disturbs it: once it leans past TOWER_BREAK_TILT
// (or drops off the table) it breaks into individual coins that keep its motion and tumble down.
// A solid column only slides when shoved, so a tower also gets wobblier the further it's pushed: after a random
// TOWER_SHOVE distance it tips over in the direction it's moving (then breaks as it leans).
const STACK_STEP = COIN_HALF * 2 + 0.2, TOWER_BREAK_TILT = Math.cos(14 * Math.PI / 180), TOWER_TWIST = 2.2;
const TOWER_SHOVE = [15, 45], TOWER_TIP_PUSH = 0.6; // speed (m/s) given to the tower's top to tip it
function stackHalf(n, top) { return (n * STACK_STEP + (top ? BONUS[top].half * 2 + 0.3 : 0)) / 2; }
// h = height of the column's centre (null: standing on the table)
function addStack(x, h, y, rot, n, top, phase) {
  const half = stackHalf(n, top);
  const desc = RAPIER.RigidBodyDesc.dynamic().setTranslation(x * M, (h == null ? half + 0.1 : h) * M, y * M)
    .setLinearDamping(0.15).setAngularDamping(0.5).setCanSleep(true);
  if (rot) desc.setRotation(rot);
  const rb = world.createRigidBody(desc);
  world.createCollider(RAPIER.ColliderDesc.roundCylinder((half - 1) * M, (COIN_R - 1) * M, 1 * M)
    .setFriction(COIN_FRICTION).setRestitution(0.05).setDensity(0.6), rb); // light, so the coins shove it along
  const t = rb.translation();
  const b = { rb, kind: 'stack', id: null, r: COIN_R, half, n, top: top || null, phase: phase == null ? rand(0, 6) : phase,
    dead: false, vy: 0, fresh: false, quest: false, sortK: null, uid: ++uids, moved: 0, limit: TOWER_SHOVE[0]+seededRandom()*(TOWER_SHOVE[1]-TOWER_SHOVE[0]), lx: t.x, lz: t.z, tipping: false };
  bodies.push(b);
  return b;
}
// Each coin of a tower: its centre relative to the column's centre (game units) and its own turn.
function stackParts(b) {
  const parts = [];
  for (let i = 0; i < b.n; i++) {
    const a = b.phase + i * 0.55;
    parts.push({ kind: 'coin', p: { x: Math.cos(a) * TOWER_TWIST, y: -b.half + COIN_HALF + i * STACK_STEP, z: Math.sin(a) * TOWER_TWIST }, q: yawTurn(i * 0.4) });
  }
  if (b.top) parts.push({ kind: b.top, p: { x: 0, y: -b.half + b.n * STACK_STEP + BONUS[b.top].half + 0.3, z: 0 }, q: yawTurn(b.phase) });
  return parts;
}
function breakStack(b) {
  const t = b.rb.translation(), q = b.rb.rotation(), lv = b.rb.linvel(), av = b.rb.angvel();
  removeCoin(b);
  for (const part of stackParts(b)) {
    const o = qrot(q, part.p);
    addCoin(part.kind, null, t.x / M + o.x, t.y / M + o.y, t.z / M + o.z, qmul(q, part.q),
      { x: lv.x + seededRandom()*.3-.15, y: lv.y, z: lv.z + seededRandom()*.3-.15 }, av);
  }
  sfx.tumble(b.n);
}

function removeCoin(b) {
  b.dead = true;
  world.removeRigidBody(b.rb);
  const i = bodies.indexOf(b);
  if (i >= 0) bodies.splice(i, 1);
}

function update(dt) {

  boardTick(dt);
  regen();
  guardAnim += ((S.guard > 0 ? 1 : 0) - guardAnim) * Math.min(1, dt * 5);
  flash = Math.max(0, flash - dt * 3);
  calloutTick(dt); moodTick(dt); musicTick();
  while (toyQueue.length && toyQueue[0].at <= time) dropToy(toyQueue.shift().id);
  // a coin shower drops its free coins one after another across the tongue
  showerTimer -= dt;
  if (showerLeft > 0 && showerTimer <= 0) {
    showerLeft--; showerTimer = 0.09;
    const b = addCoin(Math.random() < 0.25 ? 'silver' : 'coin', null, rand(T.L + 30, T.R - 30), DROP_H, DROP_Y + rand(-3, 10),
      randomTurn(rand(0.03, 0.15)), { x: 0, y: -3, z: 0 }, { x: rand(-1, 1), y: rand(-3, 3), z: rand(-1, 1) });
    b.fresh = true;
  }
  // Normal input releases once on pointerdown; holding only updates the eyes/aim.
  if (holding) aim = holdPos;
  aimShow = holding ? 1 : Math.max(0, aimShow - dt * 1.5);
  for (let i = falling.length - 1; i >= 0; i--) {
    const f = falling[i]; f.t += dt; f.vy += 1400 * dt; f.y += f.vy * dt; f.x += f.vx * dt;
    if (f.t > 0.55) falling.splice(i, 1); // dropped out of sight below the table
  }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt / 0.45; if (rings[i].t >= 1) rings.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].t += dt; if (floats[i].t > 1) floats.splice(i, 1); }
  bannerFlash = Math.max(0, bannerFlash - dt); shakeWobble = Math.max(0, shakeWobble - dt); coinFlash = Math.max(0, coinFlash - dt);

// ---------- goals: the level gauge, timed quests, the daily challenge, shakes ----------
// Long term: every coin you drop and every coin you win fills the level gauge; each level pays coins (every fifth
// also a shake). Short term: there's always a timed quest running or about to start; finish it in time for coins
// and sometimes a shake. Daily: win DAILY.target coins today. Shakes rattle the whole table for a moment, to free
// toys that have got stuck; you earn them from quests, the daily challenge, finishing sets and every fifth level.

function addXP(n) {

  while (S.xp >= xpFor(S.level)) {
    S.xp -= xpFor(S.level); S.level++;
    const coins = 15 + S.level * 5, shakes = S.level % 5 === 0 ? 1 : 0;
    S.coins += coins; S.shakes += shakes;
    callout(`Level ${S.level}!`, { voice: 'level', color: '#4fc3ff' });

const QUESTS = [ // the kinds of timed quest: target range, time range (s), coins per unit of target, chance of a shake

  { kind: 'special', text: n => `Get ${n} special coins over`, n: [2, 3], sec: [180, 240], coins: 30, shake: 1 },
  { kind: 'drop', text: n => `Drop ${n} coins`, n: [30, 50], sec: [60, 90], coins: 1, shake: 0 },

const DAILY = { target: 150, sec: 600, coins: 200, shakes: 3 };

  S.quest = { kind: q.kind, text: q.text(n), n, have: 0, ends: Date.now() + sec * 1000,
    coins: Math.max(10, Math.round(n * q.coins / 5) * 5), shakes: Math.random() < q.shake ? 1 : 0 };
}
function today() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function daily() {

  return S.daily;
}
function dailyRunning() { const d = daily(); return !d.won && d.ends > Date.now(); }
// your coin starts a try if none is running
function dailyStart() {

function questDone(q) {

// something happened that counts toward goals: 'drop' (coins dropped), 'push' (coins over the edge),

function progress(kind, n) {

    if (q.have >= q.n) questDone(q);

  S.shakes--; shake = SHAKE_SEC;

  try { navigator.vibrate && navigator.vibrate([60, 40, 60, 40, 80]); } catch (e) { }
}

// ---------- comic-book callouts ----------

function calloutLines(word) {

// ---------- drawing ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
const SPR = 3, sprites = {};
const EDGE = { coin: '#8a5c08', lucky: '#a02c86', power: '#8a5c00', x5: '#b8932a', x10: '#b8932a', silver: '#7d8290',
  clover: '#3b7a2a', smiley: '#b8860b', rainbow: '#8a4fd0', bolt: '#2b2a6a', shower: '#1d7a7a', toycoin: '#6a4a9a', joker: '#7a1030',

function drawPaw(g, x, y, s, col) {
  g.fillStyle = col;
  g.beginPath(); g.ellipse(x, y + s * 0.35, s * 0.55, s * 0.45, 0, 0, 7); g.fill();
  for (const [dx, dy] of [[-0.62, -0.25], [-0.22, -0.62], [0.22, -0.62], [0.62, -0.25]]) {

}

function makeSprite(r, draw) {

  const sc = document.createElement('canvas'); sc.width = sc.height = size;
  const g = sc.getContext('2d'); g.scale(SPR, SPR);

}

function coinSprite(r, c1, c2, c3, paw) {

    const gr = g.createRadialGradient(c - r * 0.4, c - r * 0.4, r * 0.1, c, c, r);
    gr.addColorStop(0, c1); gr.addColorStop(0.6, c2); gr.addColorStop(1, c3);
    g.fillStyle = gr; g.beginPath(); g.arc(c, c, r, 0, 7); g.fill();
    g.strokeStyle = c3; g.lineWidth = 1.2; g.beginPath(); g.arc(c, c, r * 0.74, 0, 7); g.stroke();

// A bonus chip: coloured face, a scalloped gold edge with white inlays like a casino chip, and its value in the middle.
function chipSprite(r, light, dark, label) {

    }
    g.fill();
    const gr = g.createRadialGradient(c - r * 0.35, c - r * 0.35, r * 0.1, c, c, r * 0.9);
    gr.addColorStop(0, light); gr.addColorStop(1, dark);
    g.fillStyle = gr; g.beginPath(); g.arc(c, c, r * 0.86, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.92)'; // white inlays around the rim

      g.save(); g.translate(c + Math.cos(a) * r * 0.76, c + Math.sin(a) * r * 0.76); g.rotate(a);
      g.fillRect(-r * 0.07, -r * 0.13, r * 0.14, r * 0.26); g.restore();

    g.textAlign = 'center'; g.textBaseline = 'middle';

}

// A coin face with a picture on it instead of the paw print.
function symbolCoin(r, c1, c2, c3, symbol) {

    const gr = g.createRadialGradient(c - r * 0.4, c - r * 0.4, r * 0.1, c, c, r);
    gr.addColorStop(0, c1); gr.addColorStop(0.6, c2); gr.addColorStop(1, c3);
    g.fillStyle = gr; g.beginPath(); g.arc(c, c, r, 0, 7); g.fill();
    g.strokeStyle = c3; g.lineWidth = 1.2; g.beginPath(); g.arc(c, c, r * 0.8, 0, 7); g.stroke();

const SYMBOL = {
  clover(g, c, r) { // four heart-shaped leaves and a stem

    g.beginPath(); g.moveTo(c, c); g.quadraticCurveTo(c + r * 0.15, c + r * 0.35, c + r * 0.3, c + r * 0.5); g.stroke();
    g.fillStyle = '#2f8f22';

    cols.forEach((col, i) => { g.strokeStyle = col; g.lineWidth = r * 0.09; g.beginPath(); g.arc(c, c, r * (0.74 - i * 0.1), 0, 7); g.stroke(); });
    g.fillStyle = '#fff';
    g.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * 0.08 : r * 0.2; g.lineTo(c + Math.cos(a) * rr, c + Math.sin(a) * rr); }
    g.fill();
  },
  bolt(g, c, r) {

};
// Pictures for the top faces of flat things and cube faces, drawn over a unit square (-1..1) later.
function faceSprite(w, h, draw) {
  const sc = document.createElement('canvas'); sc.width = Math.ceil(w * SPR); sc.height = Math.ceil(h * SPR);
  const g = sc.getContext('2d'); g.scale(SPR, SPR); draw(g, w, h);
  return { cv: sc };
}
function boxSprite(kind, face) {
  const key = kind + ':' + (face || '');
  if (sprites[key]) return sprites[key];
  const B = BOX[kind];
  if (kind === 'ticket') sprites[key] = faceSprite(B.hx * 2, B.hz * 2, (g, w, h) => {
    g.fillStyle = '#ff9a3d'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#c45a10'; for (const x of [0, w]) { g.beginPath(); g.arc(x, h / 2, h * 0.2, 0, 7); g.fill(); }
    g.strokeStyle = '#a8460a'; g.lineWidth = 0.8; g.setLineDash([2, 1.5]); g.strokeRect(2, 2, w - 4, h - 4); g.setLineDash([]);
    g.fillStyle = '#7a2a00'; g.font = `900 ${h * 0.42}px system-ui,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('TICKET', w / 2, h / 2 + 0.5);
  });
  else if (kind === 'cash') sprites[key] = faceSprite(B.hx * 2, B.hz * 2, (g, w, h) => {
    g.fillStyle = '#bfe3b0'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#2f6b3a'; g.lineWidth = 1.4; g.strokeRect(1.5, 1.5, w - 3, h - 3);
    g.fillStyle = '#8fc98a'; g.beginPath(); g.ellipse(w / 2, h / 2, w * 0.17, h * 0.36, 0, 0, 7); g.fill();
    g.fillStyle = '#1f4f2a'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `900 ${h * 0.55}px system-ui,sans-serif`; g.fillText('$', w / 2, h / 2 + 0.5);
    g.font = `800 ${h * 0.26}px system-ui,sans-serif`; g.fillText(VALUE.cash, w * 0.12, h * 0.25); g.fillText(VALUE.cash, w * 0.88, h * 0.75);
  });
  else sprites[key] = faceSprite(24, 24, (g, w) => { // a Rubik's cube face: 3x3 stickers on black
    g.fillStyle = '#111'; g.fillRect(0, 0, w, w);
    g.fillStyle = face;
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      g.beginPath(); g.roundRect ? g.roundRect(1 + i * 7.5, 1 + j * 7.5, 6.5, 6.5, 1.2) : g.rect(1 + i * 7.5, 1 + j * 7.5, 6.5, 6.5); g.fill();
    }

}

// a coin face with an emoji in the middle (toy coins, the jack-in-the-box coin)
function emojiCoin(r, c1, c2, c3, emoji) {
  return symbolCoin(r, c1, c2, c3, (g, c, rr) => {
    g.font = `${Math.round(rr * 1.05)}px system-ui,"Segoe UI Emoji","Noto Color Emoji"`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000';

}
// a little Rubik's cube on a toy coin
function cubeSymbol(g, c, r) {
  const s = r * 0.24, cols = ['#c41e3a', '#ffd500', '#0051ba', '#009e60', '#ff5800', '#ffffff', '#ffd500', '#c41e3a', '#0051ba'];
  g.fillStyle = '#111'; g.fillRect(c - s * 1.6, c - s * 1.6, s * 3.2, s * 3.2);
  cols.forEach((col, i) => { g.fillStyle = col; g.fillRect(c - s * 1.5 + (i % 3) * s * 1.02, c - s * 1.5 + ((i / 3) | 0) * s * 1.02, s * 0.9, s * 0.9); });
}

function sprite(kind, id) {
  const key = id ? kind + ':' + id : kind;
  if (sprites[key]) return sprites[key];
  if (kind === 'toycoin') {
    const lav = ['#f4ecff', '#c9b0f0', '#6a4a9a'];
    sprites[key] = id === 'cube' ? symbolCoin(COIN_R, ...lav, cubeSymbol)
      : emojiCoin(COIN_R, ...lav, ITEMS[id] ? ITEMS[id].emoji : id === 'ticket' ? '🎟' : '💵');
    return sprites[key];
  }
  if (kind === 'joker') { sprites[key] = emojiCoin(COIN_R, '#ffe0e8', '#e8456a', '#7a1030', '🤡'); return sprites[key]; }
  if (kind === 'silver') sprites[kind] = coinSprite(COIN_R, '#ffffff', '#c9cdd8', '#6e7480', 'rgba(70,75,90,.5)');
  else if (kind === 'clover') sprites[kind] = symbolCoin(COIN_R, '#f4ffe8', '#bfe8a0', '#4f8a3a', SYMBOL.clover);
  else if (kind === 'smiley') sprites[kind] = symbolCoin(COIN_R, '#fffbd0', '#ffd93a', '#b8860b', SYMBOL.smiley);
  else if (kind === 'rainbow') sprites[kind] = symbolCoin(COIN_R, '#ffffff', '#f0e8ff', '#8a4fd0', SYMBOL.rainbow);
  else if (kind === 'bolt') sprites[kind] = symbolCoin(COIN_R, '#8a8cff', '#3b3aa8', '#1d1c5a', SYMBOL.bolt);
  else if (kind === 'shower') sprites[kind] = symbolCoin(COIN_R, '#c8fff4', '#3cc8b4', '#1d7a7a', SYMBOL.shower);
  else if (kind === 'x5') sprites[kind] = chipSprite(BONUS.x5.r, '#5ec8ff', '#0b4f8a', '5x');
  else if (kind === 'x10') sprites[kind] = chipSprite(BONUS.x10.r, '#ff6a7a', '#8a0a22', '10x');
  else if (kind === 'lucky') sprites[kind] = coinSprite(LUCKY_R, '#ffe0f4', '#e86ac0', '#8a2a78', 'rgba(255,255,255,.85)');
  else if (kind === 'power') sprites[kind] = coinSprite(ITEM_R, '#fffbe0', '#ffcf30', '#b07a00', 'rgba(60,40,0,.85)');
  else sprites[kind] = coinSprite(COIN_R, '#fff4b0', '#f2c230', '#a8740c', 'rgba(150,100,10,.55)');
  return sprites[kind];
}

// A coin as Rapier has it: its face is the disc in the coin's own plane (axes u, w), projected into the slanted
// view; the rim is the back face, offset by the coin's thickness, in the edge colour. We look at whichever face is
// turned toward the viewer.
function drawCoinAt(kind, c, q, id) {
  let n = qrot(q, { x: 0, y: 1, z: 0 }), u = qrot(q, { x: 1, y: 0, z: 0 }), w = qrot(q, { x: 0, y: 0, z: 1 });
  if (n.y * LIFT + n.z * SQUASH < 0) { n = { x: -n.x, y: -n.y, z: -n.z }; w = { x: -w.x, y: -w.y, z: -w.z }; }
  const r = radius(kind), half = halfOf(kind), pn = projVec(n, c.s, c), pu = projVec(u, c.s, c), pw = projVec(w, c.s, c);
  ctx.fillStyle = EDGE[kind];
  for (const k of [-1, 0]) { // back face and middle, together the visible rim
    ctx.save(); ctx.translate(c.x + pn.x * half * k, c.y + pn.y * half * k); ctx.transform(pu.x, pu.y, pw.x, pw.y, 0, 0);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.restore();
  }
  const sp = sprite(kind, id);
  ctx.save(); ctx.translate(c.x + pn.x * half, c.y + pn.y * half); ctx.transform(pu.x, pu.y, pw.x, pw.y, 0, 0);
  ctx.drawImage(sp.cv, -sp.half, -sp.half, sp.half * 2, sp.half * 2); ctx.restore();
}

// A prize standing up on whatever it's resting on (the golden paw is a gold medallion on its edge).
function drawPrize(kind,id,x,y,s) {
 const side=id==='shrimp'?1:0,w=ART.snacks.width/2;
 const size=radius('item')*s*2.8;
 ctx.drawImage(ART.snacks,side*w,0,w,ART.snacks.height,x-size/2,y-size*.7,size,size);
}

function drawBody(b) {
  if(b.input&&time-b.mouthAt<MOUTH_REVEAL_SEC+MOUTH_DROP_SEC)return; // First show the coin in the mouth, then on its fall.
  const t = b.rb.translation(), x = t.x / M, h = t.y / M, y = t.z / M;
  if (b.kind === 'stack') { // a tower: its coins bottom to top, following the column's lean
    const q = b.rb.rotation();
    for (const part of stackParts(b)) {
      const o = qrot(q, part.p);
      drawCoinAt(part.kind, screenOf(x + o.x, y + o.z, h + o.y), qmul(q, part.q));
    }
  } else if (b.kind === 'item' || b.kind === 'power') {
    const c = screenOf(x, y, h - b.half);
    drawPrize(b.kind, b.id, c.x, c.y, c.s);
  } else if (BOX[b.kind]) drawBoxAt(b.kind, x, y, h, b.rb.rotation());
  else drawCoinAt(b.kind, screenOf(x, y, h), b.rb.rotation(), b.id);
}

// A ticket strip, bill or Rubik's cube as Rapier has it: each face turned toward the viewer, back faces first,
// drawn by mapping its picture (or edge colour) onto the face's parallelogram on screen.
function drawBoxAt(kind, x, y, h, q) {
  const B = BOX[kind], neg = v => ({ x: -v.x, y: -v.y, z: -v.z });
  const ex = qrot(q, { x: 1, y: 0, z: 0 }), ey = qrot(q, { x: 0, y: 1, z: 0 }), ez = qrot(q, { x: 0, y: 0, z: 1 });
  const faces = [ // [normal, its half size, edge 1, half size, edge 2, half size, face number]
    [ey, B.hy, ex, B.hx, ez, B.hz, 0], [neg(ey), B.hy, ex, B.hx, ez, B.hz, 1],
    [ex, B.hx, ez, B.hz, ey, B.hy, 2], [neg(ex), B.hx, ez, B.hz, ey, B.hy, 3],
    [ez, B.hz, ex, B.hx, ey, B.hy, 4], [neg(ez), B.hz, ex, B.hx, ey, B.hy, 5],
  ];
  const shown = faces.filter(f => f[0].y * LIFT + f[0].z * SQUASH > 0)
    .map(f => ({ f, d: f[0].z * f[1] + f[0].y * f[1] * 1.3 })).sort((a, b) => a.d - b.d);
  for (const { f: [n, dn, t1, e1, t2, e2, i] } of shown) {
    const c = screenOf(x + n.x * dn, y + n.z * dn, h + n.y * dn), p1 = projVec(t1, c.s), p2 = projVec(t2, c.s);
    ctx.save(); ctx.translate(c.x, c.y); ctx.transform(p1.x * e1, p1.y * e1, p2.x * e2, p2.y * e2, 0, 0);
    if (kind === 'cube') ctx.drawImage(boxSprite('cube', CUBE_FACES[i]).cv, -1, -1, 2, 2);
    else if (i <= 1) ctx.drawImage(boxSprite(kind).cv, -1, -1, 2, 2);
    else { ctx.fillStyle = EDGE[kind]; ctx.fillRect(-1, -1, 2, 2); }
    ctx.restore();
  }
}

// a coin falling into the bucket (or past it): flat, sinking and fading
function drawFalling(f) {
  if (f.kind === 'item' || f.kind === 'power') { drawPrize(f.kind, f.id, f.x, f.y, f.s); return; }
  const sq = Math.max(0.25, SQUASH - f.t * 1.2);
  if (BOX[f.kind]) {
    const B = BOX[f.kind], w = B.hx * 2 * f.s, h = (f.kind === 'cube' ? B.hy : B.hz) * 2 * f.s * (f.kind === 'cube' ? 1 : sq);
    ctx.drawImage(boxSprite(f.kind, f.kind === 'cube' ? CUBE_FACES[4] : '').cv, f.x - w / 2, f.y - h / 2, w, h);
    return;
  }
  const sp = sprite(f.kind, f.id), r = radius(f.kind) * f.s;
  ctx.fillStyle = EDGE[f.kind]; ctx.beginPath(); ctx.ellipse(f.x, f.y + 2 * f.s, r, r * sq, 0, 0, 7); ctx.fill();
  const w = sp.cv.width / SPR * f.s;
  ctx.drawImage(sp.cv, f.x - sp.half * f.s, f.y - sp.half * f.s * sq, w, w * sq);
}

function blitFlat(kind, x, y, s = 0.75) {
  const sp = sprite(kind), w = sp.cv.width / SPR * s;
  ctx.drawImage(sp.cv, x - sp.half * s, y - sp.half * s, w, w);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

async function loadArt() {
 async function image(src) { const im = new Image(); im.src = src; await im.decode(); return im; }
 const [head,table,tongue,paw,coin,snacks,pupil,headOpen]=await Promise.all(['head','table','tongue','paw','coin','snacks','pupil','head-open'].map(n=>image('img/art/'+n+'.png')));
 Object.assign(ART,{head,table,tongue,paw,coin,snacks,pupil,headOpen});
 const face=newCanvas(COIN_R*2*SPR,COIN_R*2*SPR);face.getContext('2d').drawImage(coin,21,21,1209,1202,0,0,face.width,face.height);
 sprites.coin={cv:face,half:COIN_R};sprites.silver=sprites.coin;
}

// The machine is drawn zoomed in (VIEW.z) around the screen's centre, so the table fills more of the screen and the
// arms run partly off the sides; it's placed (VIEW.y) so the bucket sits near the bottom of the screen.
// On tall phones the machine is also stretched a little taller (VIEW.zy, at most 12% more than its width), which
// gives more table, and any space still left over is split between above the cat and below the bucket.
const VIEW = { z: 1, zy: 1, y: 0 };
const MACHINE_TOP = 34, MACHINE_BOTTOM = 640; // tips of the ears and bottom of the paws, in game units
function fitView() {
  // the machine fits between the top bar (its ears may tuck behind the quest banner) and the bottom bar
  const top = PAD_T + BAR_H, bottom = H - PAD_B - BOTTOM_H + 6;
  VIEW.z = H >= 800 ? 1.08 : 1.0;
  VIEW.zy = Math.max(VIEW.z, Math.min(VIEW.z * 1.12, (bottom - top) / (MACHINE_BOTTOM - MACHINE_TOP)));
  VIEW.y = bottom - MACHINE_BOTTOM * VIEW.zy;
  const gapTop = VIEW.y + MACHINE_TOP * VIEW.zy - top;
  if (gapTop > 12) VIEW.y -= (gapTop - 12) / 2;
}
function screenToGameX(sx) { return (sx - 200) / VIEW.z + 200; }
// The picture is also drawn ART_ZX times wider than it is (around the centre), so the cat's cheeks reach the
// screen's edges and the table is wider; the projection (P_X) is widened by the same amount to match.
function artX(x) { return 200 + (x - 200) * ART_ZX; }

function drawMachine() {
 ctx.drawImage(ART.table,0,180,400,420);
 drawTongue();
}

function drawTrackingPupils() {
 const look=Math.max(-1,Math.min(1,(pupilAim-200)/140));
 const sx=420/ART.head.width,sy=240/ART.head.height;
 for(const e of [{x:500,y:515,rx:118,ry:108},{x:1060,y:532,rx:118,ry:108}]) {
  const cx=-10+e.x*sx,cy=-25+e.y*sy,w=75*sx,h=180*sy;
  ctx.save();ctx.beginPath();ctx.ellipse(cx,cy,e.rx*sx,e.ry*sy,0,0,7);ctx.clip();
  // Upright pupils translate left/right; no rotation, tilt or skew is applied.
  ctx.drawImage(ART.pupil,483,107,289,1041,cx+look*e.rx*sx*.28-w/2,cy+e.ry*sy*.24-h/2,w,h);
  ctx.restore();
 }
}

// Slit pupils that follow where you're aiming (and glance down at the table), with a blink every few seconds.
let blinkAt = 3;
function drawEyes(ls) {
  const look = Math.max(-1, Math.min(1, (aim.x - 200) / 150));
  if (time > blinkAt + 0.14) blinkAt = time + rand(2.5, 6);
  const shut = ls > 0.1 ? 0 : time > blinkAt ? 1 - Math.abs((time - blinkAt) / 0.07 - 1) : 0; // 0 open .. 1 closed
  for (const e of EYES) {
    const cx = artX(e.x * AK), cy = e.y * AK, rx = e.rx * AK * ART_ZX * 0.82, ry = e.ry * AK * 0.86;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.clip();
    const px = cx + look * rx * 0.62, py = cy + ry * 0.12;
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(px, py, rx * (0.2 - 0.1 * ls), ry * 0.78, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(px + rx * 0.12, py - ry * 0.32, rx * 0.12, 0, 7); ctx.fill();
    if (shut > 0) { // eyelid coming down
      ctx.fillStyle = `rgb(${FUR})`;
      ctx.fillRect(cx - rx, cy - ry, rx * 2, ry * 2 * shut);
    }
    ctx.restore();
    if (ls > 0.05) { // a scowl: a heavy black brow slanting down toward the nose
      const inward = cx < 200 ? 1 : -1;
      ctx.save(); ctx.globalAlpha = Math.min(1, ls * 2.5);
      ctx.fillStyle = '#0c0a10';
      ctx.beginPath();
      ctx.moveTo(cx - inward * rx * 1.1, cy - ry * 1.15);
      ctx.lineTo(cx + inward * rx * 0.9, cy - ry * (0.55 - 0.25 * ls));
      ctx.lineTo(cx + inward * rx * 0.95, cy - ry * (0.2 - 0.25 * ls));
      ctx.lineTo(cx - inward * rx * 1.0, cy - ry * 0.85);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

// The tongue is a rigid tray sliding out of the mouth; its artwork never stretches.
function drawTongue() {
 const left=screenOf(200-PUSH_HALF,tongueDrawY,0);
 const right=screenOf(200+PUSH_HALF,tongueDrawY,0);
 const rear=screenOf(200,tongueDrawY-60,TONGUE_H);
 // Project the rigid physical tray: fixed height, full contact width, front edge on the shelf.
 ctx.drawImage(ART.tongue,45,278,1686,391,left.x,rear.y,right.x-left.x,left.y-rear.y);
}

function bucketRect() {
  const w = (BUCKET_BOX[2] - BUCKET_BOX[0]) * AK * BUCKET_SCALE * ART_ZX, h = (BUCKET_BOX[3] - BUCKET_BOX[1]) * AK * BUCKET_SCALE;
  return { x: 200 - w / 2, y: TABLE_CUT * AK, w, h };
}

function drawBucket() {
  const b = bucketRect();
  ctx.drawImage(ART.bucket, b.x, b.y, b.w, b.h);
  // heap of won coins inside the rim, rising slowly as you win
  const n = Math.min(90, S.won), cy = BUCKET_TOP;
  for (let i = 0; i < n; i++) {
    const a = (i * 137.5) % 360 * Math.PI / 180, rr = ((i * 61) % 100) / 100;
    const x = 200 + Math.cos(a) * rr * b.w * 0.38, y = cy + Math.sin(a) * rr * 4 - Math.min(5, i / 18);
    ctx.fillStyle = '#8a5c08'; ctx.beginPath(); ctx.ellipse(x, y + 1.2, 8, 3, 0, 0, 7); ctx.fill();
    ctx.fillStyle = i % 9 === 0 ? '#fff0a0' : '#f0c030'; ctx.beginPath(); ctx.ellipse(x, y, 8, 3, 0, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(`${S.won} won`, 200, b.y + b.h * 0.62);
}

// The paws rest on the table's front corners beside the bucket, kneading: each slowly spreads open (wider, turned
// out a little) and closes again, the two out of step. With the golden paw they swing in over the gaps.
// big paws in the bottom corners: width, how far in from the screen edge their centres sit, how far below the
// table's front corner, and how far they're turned (radians) so the toes point inward
const PAW_SIZE = 150, PAW_INSET = 40, PAW_DROP = 38, PAW_TURN = 2.35;
function drawPaws() {
 const resting=410;
 let depth=resting,reach=0;
 if(sweepTime>0){
  if(sweepTime<.2){const p=sweepTime/.2;depth=resting+(SWEEP_START-resting)*p;reach=p;}
  else if(sweepTime<=1.7){const p=(sweepTime-.2)/1.5;depth=SWEEP_START+(SWEEP_END-SWEEP_START)*p;reach=1;}
  else {const p=(sweepTime-1.7)/(.7);depth=SWEEP_END+(resting-SWEEP_END)*p;reach=1-p;}
 }
 const cy=VIEW.y+proj(200,depth).y*VIEW.zy;
 for(const side of [-1,1]) {
  const base=side<0?-85:W+85,inner=side<0?100:W-100;
  ctx.save();ctx.translate(base+(inner-base)*reach,cy-35*(1-reach)+Math.sin(time*2)*1.2);
  if(side>0)ctx.scale(-1,1);
  const w=280,h=w*ART.paw.height/ART.paw.width;
  ctx.drawImage(ART.paw,-w/2,-h/2,w,h);ctx.restore();
 }
}

// A gold ring on the tongue where your coin will land.
function drawAim() {
  if (aimShow <= 0) return;
  const c = screenOf(aim.x, DROP_Y, TONGUE_H), rad = COIN_R * c.s;
  ctx.globalAlpha = 0.85 * aimShow; ctx.strokeStyle = '#ffe680'; ctx.lineWidth = 2.5;
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.ellipse(c.x, c.y, rad, rad * SQUASH, 0, 0, 7); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;
}

const BUCKET_TOP = 589;

function draw() {
  ctx.setTransform(scale * devicePixelRatio, 0, 0, scale * devicePixelRatio, 0, 0);
  ctx.fillStyle = `rgb(${BG})`; ctx.fillRect(0, 0, W, H);
  // the machine, zoomed in around the centre (and shaking while lightning strikes)
  const sh = shake > 0 ? shake * 6 : 0;
  ctx.save(); ctx.translate(200 + rand(-sh, sh), VIEW.y + rand(-sh, sh) * 0.5); ctx.scale(VIEW.z, VIEW.zy); ctx.translate(-200, 0);
  drawMachine();
  // Aiming ring removed; tap position still controls drops and pupil tracking.
  // back to front: further back first, and lower before higher, so piles stack up the right way
  // (a tower sorts by its base, so coins in front of it still draw over it)
  // The order is smoothed and only changes when two coins are clearly apart: coins jiggling in a pile used to swap
  // order every frame, which flickered.
  for (const b of bodies) {
    const t = b.rb.translation(), k = t.z / M + (t.y / M - (b.kind === 'stack' ? b.half : 0)) * 1.3;
    b.sortK = b.sortK === null ? k : Math.abs(k - b.sortK) > 1.5 ? k : b.sortK;
  }
  bodies.sort((a, b) => a.sortK - b.sortK || a.uid - b.uid);
  for (const b of bodies) drawBody(b);
  // Rear coins are inside the mouth: the upper lip and muzzle occlude them.
  ctx.drawImage(ART.head,-10,-25,420,240);
  // The new head includes the small, stationary mouth and tongue; no old-style mouth patch is overlaid.
  drawTrackingPupils();
  for(const b of bodies){
    if(!b.input||time-b.mouthAt>=MOUTH_REVEAL_SEC+MOUTH_DROP_SEC)continue;
    const u=Math.max(0,(time-b.mouthAt-MOUTH_REVEAL_SEC)/MOUTH_DROP_SEC),t=b.rb.translation(),end=screenOf(t.x/M,t.z/M,t.y/M);
    const ease=u*u;
    drawCoinAt(b.kind,{...end,x:199+(end.x-199)*ease,y:153+(end.y-153)*ease,s:.8+(end.s-.8)*ease},b.rb.rotation(),b.id);
  }
  for (const f of falling) {
    // tipping over the edge and dropping away, fading as it goes (the ones at the corners go behind the paws)
    ctx.globalAlpha = Math.max(0, 1 - f.t * 1.9);
    drawFalling(f);
    ctx.globalAlpha = 1;
  }
  for (const r of rings) {
    ctx.globalAlpha = 1 - r.t; ctx.strokeStyle = '#fff3b0'; ctx.lineWidth = 2.5 * (1 - r.t) + 0.5;
    const rad = (14 + r.t * 34) * r.s;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, rad, rad * SQUASH, 0, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (const f of floats) {
    ctx.globalAlpha = 1 - f.t; ctx.fillStyle = f.big ? '#ff9ad8' : '#ffd76a';
    ctx.font = `bold ${f.big ? 22 : 16}px system-ui`; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y - f.t * 40); ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(230,235,255,${flash * 0.6})`; ctx.fillRect(0, 0, W, H); } // lightning flash
  drawHUD();
  // Collection messages rise and fade; canvas text never captures taps.
  const toast=itemToasts[0];
  if(toast){ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,(1.1-toast.t)/.2));ctx.textAlign='center';
    ctx.font='italic 600 32px Impact, "Arial Black", system-ui';ctx.lineJoin='round';ctx.lineWidth=3;
    const progress=Math.min(1,toast.t/.8),start=H-PAD_B-BOTTOM_H-24,y=start+(H*.42-start)*progress;
    ctx.strokeStyle='#382336';ctx.fillStyle='#ffe680';
    const lines=[toast.text.replace(/ COLLECTED!$/,''),'COLLECTED!'];
    lines.forEach((line,i)=>{ctx.strokeText(line,200,y-18+i*35);ctx.fillText(line,200,y-18+i*35);});ctx.restore();}
  drawCallout();
}

// ---------- screen layout ----------
// A border top and bottom (PAD_T, PAD_B) so nothing sits under the phone's rounded corners or camera. Top: the bar
// (coins, level gauge, collection, sound) and the quest banner under it. Bottom: the daily challenge and the shake button.
const PAD_T = 26, BAR_H = 44, BANNER_H = 28, PAD_B = 18, BOTTOM_H = 62;
function shakeButton() { return { x: 200, y: H - PAD_B - BOTTOM_H / 2, r: 26 }; }
function clock(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function bar(x, y, w, h, f, col) {
  ctx.fillStyle = 'rgba(255,255,255,.14)'; roundRect(x, y, w, h, h / 2); ctx.fill();
  if (f > 0) { ctx.fillStyle = col; roundRect(x, y, Math.max(h, w * Math.min(1, f)), h, h / 2); ctx.fill(); }
}
// The quest meter: a tall tube up the right side of the table that fills toward the quest's goal, with the count
// in big numbers on top (it bumps each time it goes up).
function drawQuestMeter() {
  const q = S.quest;
  if (!q) return;
  const sy = z => VIEW.y + VIEW.zy * proj(T.R, z).y; // a table depth → screen y
  const top = sy(PUSH_MAX) + 34, bot = sy(T.FRONT) - 6, x = W - 22, w = 14, f = q.have / q.n;
  ctx.fillStyle = 'rgba(18,11,28,.6)'; roundRect(x - w / 2 - 3, top - 3, w + 6, bot - top + 6, (w + 6) / 2); ctx.fill();
  if (f > 0) {
    const h = Math.max(w, (bot - top) * f), g = ctx.createLinearGradient(0, bot - h, 0, bot);
    g.addColorStop(0, '#c8ff9a'); g.addColorStop(1, '#2fbf3a');
    ctx.fillStyle = g; roundRect(x - w / 2, bot - h, w, h, w / 2); ctx.fill();
  }
  const s = 1 + meterBump * 0.45;
  ctx.save(); ctx.translate(x - 4, top - 22); ctx.scale(s, s);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.font = 'italic 900 26px Impact, "Arial Black", system-ui';
  ctx.lineWidth = 6; ctx.strokeStyle = '#111'; ctx.strokeText(q.have, 0, 0);
  ctx.fillStyle = q.have >= q.n ? '#7dff6a' : '#ffe680'; ctx.fillText(q.have, 0, 0);
  ctx.font = '900 11px system-ui'; ctx.lineWidth = 4; ctx.strokeText('/' + q.n, 2, 18);
  ctx.fillStyle = '#fff'; ctx.fillText('/' + q.n, 2, 18);
  ctx.restore();
}
function drawBoardHUD() {
 const by=PAD_T+BAR_H;
 ctx.textBaseline='middle';ctx.textAlign='left';
 ctx.fillStyle='rgba(18,11,28,.9)';ctx.fillRect(0,0,W,by+BANNER_H);
 ctx.fillStyle='#ffd76a';ctx.font='bold 19px system-ui';ctx.fillText(board.remaining+' coins',12,PAD_T+21);
 ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.fillText('BOARD '+(boardIndex+1)+' / '+BOARDS.length,190,PAD_T+21);
 ctx.textAlign='right';ctx.font='22px system-ui';ctx.fillText(S.muted?'🔇':'🔊',W-12,PAD_T+21);
 if(window.Android){ctx.font='20px system-ui';ctx.fillText('↻',W-66,PAD_T+21);}
 ctx.textAlign='left';ctx.font='bold 12px system-ui';ctx.fillStyle=BOARD.seconds-board.elapsed<20?'#ff7a7a':'#fff';
 ctx.fillText(clock((BOARD.seconds-board.elapsed)*1000),12,by+14);
 for(let i=0;i<BOARD.targets.length;i++) {
  const t=BOARD.targets[i],got=board.collected.includes(t.id);
  ctx.fillStyle=got?'#7dff6a':'#fff';ctx.fillText((got?'✓ ':'')+ITEMS[t.id].name,95+i*135,by+14);
 }
 drawPaws();
 const bottom=H-PAD_B-BOTTOM_H;
 ctx.fillStyle='rgba(18,11,28,.85)';ctx.fillRect(100,bottom,200,BOTTOM_H);
 ctx.textAlign='center';ctx.fillStyle='#ffe680';ctx.font='bold 13px system-ui';
 ctx.fillText(board.status==='won'?(boardIndex<BOARDS.length-1?'NEXT BOARD':'BOTH BOARDS CLEAR'):board.status==='lost'?'TRY AGAIN':sweepTime>0?'PAW SWEEP!':board.sweeps>0?'PAW SWEEP · 1':board.status==='settling'?'LAST COINS SETTLING':board.status==='ready'?'TRY PAW SWEEP':'PUSH BOTH SNACKS',200,bottom+18);
 ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText(board.status==='lost'?(board.endReason==='time'?"Time’s up · Tap to retry":"Out of coins · Tap to retry"):board.status==='won'?'Replay board '+(boardIndex+1):board.status==='ready'?'Tap board to play':board.sweeps>0?'Tap above to sweep · Restart below':'Restart board',200,bottom+42);
 ctx.fillStyle='#c0b8cc';ctx.font='9px system-ui';ctx.fillText(BUILD+' · '+Math.round(perf.fps)+' fps · '+bodies.length+' bodies',200,H-5);
 ctx.textAlign='right';ctx.font='12px system-ui';ctx.fillText('i',W-8,H-6);
}

  const y0 = PAD_T, emoji = 'system-ui,"Segoe UI Emoji","Noto Color Emoji"';

  ctx.fillText(`${BUILD} · physics ${perf.step.toFixed(1)} ms · ${Math.round(perf.fps)} fps · ${bodies.length} coins`, 8, H - 5);
}

function resize() {
  H = Math.max(720, Math.min(960, W * innerHeight / innerWidth));
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * devicePixelRatio); cv.height = Math.round(H * scale * devicePixelRatio);
  fitView();
}

// ---------- collection panel ----------
const panel = document.getElementById('panel');
function openCredits() {
 holding=false;taps=[];
 panel.innerHTML='<button id="close">Close</button><h2>Cat Coin Pusher</h2><p>Game effects only. Background music is off.</p><p>The first snack earns Paw Sweep. Tap PAW SWEEP in the bottom-center button to use it; tap the lower Restart line to replay.</p>';
 panel.style.display='block';panel.querySelector('#close').onclick=()=>{panel.style.display='none';};
}
function openPanel() { return;

  let h = '<button id="close">Close</button><h2>🎒 Collection</h2>';
  // on the phone app: check for a newer game in OneDrive right now
  if (window.Android && Android.checkUpdates) h += '<button id="checkupd" class="wide">🔄 Check for updates</button>';
  const dl = daily();
  h += `<div class="set"><h3><span>Level ${S.level}</span><span>${S.xp} / ${xpFor(S.level)}</span></h3>`
    + `<div class="reward">Shakes: ${S.shakes} · ⭐ Daily challenge (win ${DAILY.target} coins in ${DAILY.sec / 60} min): ${dl.won ? 'won today!' : dailyRunning() ? `${dl.have} / ${DAILY.target}, ${clock(dl.ends - Date.now())} left` : `${dl.tries} tr${dl.tries === 1 ? 'y' : 'ies'} so far today`}`
    + `${S.quest ? ` · ⏱ ${S.quest.text}: ${S.quest.have}/${S.quest.n}` : ''}</div>`
    + '<div class="reward">Finish a set for +' + SET_REWARD.coins + ' coins and +' + SET_REWARD.shakes + ' shakes; a new set takes its place.</div></div>';
  for (const s of activeSets()) {
    const n = s.items.filter(([i]) => S.got[i]).length;
    h += `<div class="set"><h3><span>${s.name}</span><span>${n}/${s.items.length}</span></h3><div class="items">`;
    for (const [id, emoji, name] of s.items) h += `<div class="it${S.got[id] ? '' : ' no'}"><b>${emoji}</b>${name}${S.got[id] > 1 ? ' ×' + S.got[id] : ''}</div>`;
    h += `</div><div class="reward${S.sets[s.name] ? ' on' : ''}">${S.sets[s.name] ? 'Unlocked: ' : 'Complete the set to unlock: '}${s.reward}</div></div>`;
  }
  const finished = SETS.filter(s => S.sets[s.name]).map(s => s.name);
  if (finished.length) h += `<div class="reward on">Finished sets: ${finished.join(', ')}</div>`;
  h += `<div class="reward">Coins won so far: ${S.won} · Tickets: 🎟 ${S.tickets || 0}</div>`;
  h += '<button id="newtable">Start a new table</button><div class="reward">Keeps your coins and collection.</div>';
  h += `<button id="devmode" class="devswitch">Developer mode: ${S.dev ? 'on' : 'off'}</button>`;
  if (S.dev) {
    h += '<div class="set" style="margin-top:18px"><h3><span>Developer</span><span>for testing</span></h3><div class="dev">'
      + '<button data-coins="100">+100 coins</button><button data-coins="1000">+1,000 coins</button><button data-coins="0">Set to 0</button>'
      + '<button data-guard="1">Golden paw now</button><button data-shakes="3">+3 shakes</button><button data-quest="1">New quest</button>'
      + '<button data-callout="1">Test callout</button></div><div class="reward">Drop next:</div><div class="dev">'
      + DEV_DROPS.map(([k, label]) => `<button data-drop="${k}"${forcedDrop === k ? ' class="on"' : ''}>${label}</button>`).join('')
      + '</div></div>';
  }
  panel.innerHTML = h; panel.style.display = 'block';
  // each developer button flashes, says what it did for a moment, and buzzes (where the phone allows it)
  const done = (b, text) => {
    try { navigator.vibrate && navigator.vibrate(20); } catch (e) { }
    const was = b.dataset.label || (b.dataset.label = b.textContent);
    b.textContent = text; b.classList.add('done');
    setTimeout(() => { b.textContent = was; b.classList.remove('done'); }, 1100);
  };
  for (const b of panel.querySelectorAll('[data-coins]')) b.onclick = () => {
    const n = +b.dataset.coins; S.coins = n ? S.coins + n : 0; save(); done(b, `✓ ${S.coins.toLocaleString()} coins`);
  };
  for (const b of panel.querySelectorAll('[data-guard]')) b.onclick = () => { S.guard += GUARD_SEC; done(b, `✓ paws in ${Math.round(S.guard)} s`); };
  for (const b of panel.querySelectorAll('[data-shakes]')) b.onclick = () => { S.shakes += 3; save(); done(b, `✓ ${S.shakes} shakes`); };
  for (const b of panel.querySelectorAll('[data-quest]')) b.onclick = () => { newQuest(); done(b, '✓ new quest'); };
  for (const b of panel.querySelectorAll('[data-callout]')) b.onclick = () => {
    panel.style.display = 'none'; callout('Crown!', { voice: 'got', emoji: '👑' }); catGrowl();
  };
  for (const b of panel.querySelectorAll('[data-drop]')) b.onclick = () => {
    forcedDrop = b.dataset.drop; done(b, '✓ next drop');
    for (const o of panel.querySelectorAll('[data-drop]')) o.classList.toggle('on', o === b);
  };
  document.getElementById('close').onclick = () => { panel.style.display = 'none'; };
  document.getElementById('devmode').onclick = () => { S.dev = !S.dev; save(); openPanel(); if (S.dev) panel.scrollTop = 99999; };
  const cu = document.getElementById('checkupd');
  if (cu) cu.onclick = () => { save(); cu.textContent = 'Checking…'; Android.checkUpdates(); setTimeout(() => { cu.textContent = '🔄 Check for updates'; }, 1500); };
  // two taps, so a stray tap can't wipe the table
  const nt = document.getElementById('newtable');
  nt.onclick = () => {
    if (!nt.dataset.armed) { nt.dataset.armed = '1'; nt.textContent = 'Tap again to clear the table'; return; }
    panel.style.display = 'none';
    newTable();
  };
}

// A fresh table (heaped coins, towers, prizes), settled before it's shown. Coins in hand and the collection stay.
function newTable() { resetBoard(); return;

  for (const b of bodies.slice()) removeCoin(b);
  falling = []; rings = []; floats = []; taps = [];
  prefill();
  for (let i = 0; i < 90; i++) world.step();
  save();
  say('table', true);
}

// ---------- input ----------
function toGame(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
// The spot on the drop line straight across from where you touch (only left/right comes from the touch).
function aimFromScreen(sx) {
  const lookX=Math.max(T.L,Math.min(T.R,unprojX(screenToGameX(sx),DROP_Y)));
  return { x: Math.max(200-PUSH_HALF+COIN_R, Math.min(200+PUSH_HALF-COIN_R, lookX)), y: DROP_Y, lookX };
}
cv.addEventListener('pointerdown', e => {
  if (!world) return; // still loading
  sfx.unlock(); musicOK = true; musicTick();
  const p = toGame(e);
  if(p.y>H-26&&p.x>W-35){openCredits();return;}
  if(p.y>H-PAD_B-BOTTOM_H&&p.x>=100&&p.x<=300) {
    if(p.y<H-PAD_B-BOTTOM_H+32&&board.status==='won'){nextBoard();return;}
    if(p.y<H-PAD_B-BOTTOM_H+32&&board.status==='ready'){previewPawSweep();return;}
    if(p.y<H-PAD_B-BOTTOM_H+32&&sweepTime>0)return;
    if(p.y<H-PAD_B-BOTTOM_H+32&&board.sweeps>0&&!['won','lost'].includes(board.status)){usePawSweep();return;}
    resetBoard();return;
  }
  // the top bar and quest banner: collection and sound buttons (nothing else up there)
  if (p.y < PAD_T + BAR_H + BANNER_H) {
    if (p.y > PAD_T - 6 && p.y < PAD_T + BAR_H) {
      if (p.x > W - 52) { S.muted = !S.muted; saveAudioSettings();musicTick(); }
      else if (p.x > W - 100 && window.Android) Android.checkUpdates();
    }
    return;
  }
  // the shake button; everywhere else (including the bottom of the screen) drops coins
  if(board.status==='won'||board.status==='lost')return;
  const sb = shakeButton();
  if (Math.hypot(p.x - sb.x, p.y - sb.y) < sb.r + 8) { useShake(); return; }
  cv.setPointerCapture(e.pointerId);
  holding = true; holdPos = aimFromScreen(p.x); aim = holdPos; aimShow = 1;
  tryDrop(holdPos);
});
cv.addEventListener('pointermove', e => { if (holding) holdPos = aimFromScreen(toGame(e).x); });
for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, () => { holding = false; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);

// ---------- main loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (dt > 0) perf.fps += (1 / dt - perf.fps) * 0.05;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n++ < 3) { step(); acc -= STEP; }
  if (acc > STEP) acc = 0; // a slow phone drops time rather than falling ever further behind
  update(dt); draw();
  requestAnimationFrame(frame);
}
Promise.all([RAPIER.init(), loadArt()])
  .then(() => { initPhysics(); load(); regen(); resize(); last = performance.now(); requestAnimationFrame(frame); })
  .catch(e => { document.body.insertAdjacentHTML('beforeend', `<p style="color:#fff">Could not start: ${e}</p>`); });
// Test hook: run the game faster than real time, e.g. __game.sim(10, 0.25) = 10 s with a drop every 0.25 s.
window.__game = {
  BOARDS, get BOARD(){return BOARD;}, get boardIndex(){return boardIndex;}, selectBoard, nextBoard, get board() { return board; }, resetBoard, usePawSweep, get sweeping(){return sweepTime>0;}, draw, resize, loadArt, get perf() { return perf; },
  S, get bodies() { return bodies; }, get world() { return world; }, tryDrop, save, sfx, prefill,
  // test helper: start over with a new table using a given collision shape
  restart(shape, sides) {
    SHAPE = shape || SHAPE; SHAPE_SIDES = sides || SHAPE_SIDES;
    for (const b of bodies.slice()) removeCoin(b);
    prefill();
  },
  tick() {step();update(STEP);},
  sim(sec, every) {
    let next = 0;
    for (let t = 0; t < sec; t += STEP) {
      if (every && t >= next) { tryDrop({ x: rand(T.L + 30, T.R - 30), y: DROP_Y }); next += every; }
      step(); update(STEP);
    }
  },
};
</script>
