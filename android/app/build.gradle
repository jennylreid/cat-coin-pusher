plugins {
    id 'com.android.application'
}

// Keep generated Android outputs outside OneDrive when its sync client holds file locks.
layout.buildDirectory = file(System.getenv('UAT15_BUILD_DIR') ?: 'build')

android {
    namespace 'com.jenny.catpusher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jenny.catpusher'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '2026.10.16'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
